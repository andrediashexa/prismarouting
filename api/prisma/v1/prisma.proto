message GetSystemRequest {}

message SystemInfo {
  string hostname = 1;
  uint64 uptime_seconds = 2;
  // The `system cpu` layout this boot runs.
  string control_plane_cpus = 3;
  string main_thread_cpu = 4;
  string worker_cpus = 5;
  uint32 workers = 6;
  // 1G hugepages reserved now.
  uint32 hugepages = 7;
  // `show system cpu` and `show system memory`, verbatim.
  string cpu_text = 8;
  string memory_text = 9;
  // Since when each part of the box runs (#534, 0.148.7), as
  // `show system uptime` reads them; a field left unset was not read.
  // The kernel's boot.
  google.protobuf.Timestamp boot_time = 10;
  // The dataplane (VPP), from VPP's own clock.
  google.protobuf.Timestamp dataplane_started = 11;
  // The routing daemons (FRR).
  google.protobuf.Timestamp control_plane_started = 12;
  // The VTY's management container; unset when the VTY runs on the host.
  google.protobuf.Timestamp vty_started = 13;
  // Why the box last booted, only as recorded: "system reboot by <account>",
  // "system shutdown by <account>", or "not recorded" (a power cut, a
  // hypervisor, a reboot from a shell). Never a guess.
  string last_boot_reason = 14;
  // When the release the box runs was installed or upgraded to.
  google.protobuf.Timestamp release_installed_at = 15;
  // True when the dataplane started more than five minutes after the box:
  // it restarted on its own since the boot.
  bool dataplane_restarted = 16;
  // The host's RAM as numbers (#533), from the kernel's meminfo: what it
  // has, and what is not available to a new allocation - MemTotal less
  // MemAvailable, so the hugepages the dataplane reserved count as used.
  uint64 memory_total_bytes = 17;
  uint64 memory_used_bytes = 18;
  // Of the used, the 1G hugepages reserved for the dataplane.
  uint64 memory_hugepages_bytes = 19;
  // How loaded each dataplane worker is (#533). A polling worker's CPU is
  // always 100%; these are what the dataplane itself counts.
  repeated WorkerLoad worker_load = 20;
}

// One dataplane worker's load, from the dataplane's statistics segment.
message WorkerLoad {
  // The worker's number: 0 is the dataplane's vpp_wk_0.
  uint32 worker = 1;
  // The CPU it runs on, from `show system cpu`'s this-boot layout; with no
  // layout read, the worker's number.
  uint32 cpu = 2;
  // Packets per call of a graph node over the dataplane's last interval
  // (VPP's /sys/vector_rate_per_worker, whole vectors): near 0 idle, up to
  // 256 when every call takes a full frame.
  double vectors_per_call = 3;
  // The share of the worker's node time its graph took, 0 to 1, over the
  // window below: the clocks of the nodes that run only with packets, over
  // every node's - the input nodes' polling included - from `show
  // runtime`. Not the receive inside the input node, which shares its
  // clocks with the polling, so a worker that cannot keep up reads below 1:
  // 0.49 for the lab's worker saturated by a packet generator. A worker running under 1,000 loops
  // a second is waiting for interrupts, not polling: 0, and
  // vectors_per_call 0 with it.
  double busy_ratio = 4;
  // The main loop's rate (VPP's /sys/loops_per_worker); the dataplane
  // updates it, and vectors_per_call, every 10 s.
  double loops_per_second = 5;
  // The window busy_ratio was measured over, in milliseconds: since the
  // server's previous reading, at least a second and at most a minute.
  uint32 busy_window_ms = 6;
}

