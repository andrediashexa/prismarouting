// Prisma Routing management API, version 1 (#532).
//
// WHAT THIS IS. The contract a management client - the web interface's Rust
// backend first (tonic) - speaks to a box. It drives the VTY's own model: the
// candidate, `show configuration compare`, `commit check`, `commit`,
// `commit confirmed`, `rollback`, `save`, through the same code `prismash`
// runs, so a refusal here is the VTY's refusal in the VTY's words, and a
// change made here shows in `show running-config` at the prompt.
//
// CONFIGURATION TRAVELS AS THE VTY'S OWN TEXT. A candidate is edited with the
// lines an operator types (`block-size 256` under `nat` /
// `cgnat` / `pool X`), and read back as the text `show running-config`
// prints. Nothing here models a configuration statement as a message:
// modelling the grammar a second time is how two descriptions of one box
// drift apart. What IS typed is the operations and the operational data.
//
// COMPATIBILITY RULES, for every message and service in package prisma.v1:
//   * a field is only ever ADDED, with a number never used before in that
//     message; a field is never renumbered, retyped or reused;
//   * a field that stops being filled is marked `reserved`, never deleted
//     and re-numbered;
//   * an rpc or an enum value is only ever added;
//   * services are grouped by subject: a new rpc goes into the service its
//     subject belongs to, and a new service only comes with a new subject
//     (RouteService, SessionService, #533). A client generated with stubs
//     that answer UNIMPLEMENTED by default (tonic's
//     generate_default_stubs) keeps building when an rpc is added to a
//     service it implements;
//   * anything else - a removed field, a changed meaning, a renamed rpc - is
//     a breaking change and goes into package prisma.v2, served beside v1.
// A client built against an older prisma.v1 keeps working against a newer
// box; it does not see the fields it does not know.
//
// ERRORS. A call that is refused answers a gRPC status - INVALID_ARGUMENT for
// a line the VTY refuses, FAILED_PRECONDITION for a commit the box refuses or
// a candidate whose base the running configuration has moved past,
// PERMISSION_DENIED for an account without the role, NOT_FOUND for a
// candidate that does not exist, UNAVAILABLE when the dataplane does not
// answer - and carries the VTY's own account of it in the trailing metadata
// key `prisma-diagnostics-bin`: a serialized `Diagnostics` message. A
// `commit check` that finds problems is NOT an error: answering that is its
// job, and it returns them in `CheckResponse`.
//
// IDENTITY. The box account a call acts as is the Common Name of the client
// certificate the mutual-TLS handshake presented; it has the roles the VTY
// login gives that account, and every change is recorded in the
// configuration trail as made by it. See docs/api.md.

syntax = "proto3";

package prisma.v1;

import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------- common

// One thing the VTY said about a request: a refusal, a warning or a note,
// with the configuration path it is about when it names one.
message Diagnostic {
  enum Severity {
    SEVERITY_UNSPECIFIED = 0;
    SEVERITY_ERROR = 1;
    SEVERITY_WARNING = 2;
    SEVERITY_NOTE = 3;
  }
  Severity severity = 1;
  // The VTY's message, as it prints it, without the "error: " prefix.
  string message = 2;
  // The hierarchy the message is about, outermost first, e.g.
  // ["nat", "cgnat", "pool RFC6598"]; empty when it names none.
  repeated string path = 3;
  // The configuration line it is about, when it names one.
  string line = 4;
}

// What travels in `prisma-diagnostics-bin` on a refused call.
message Diagnostics {
  repeated Diagnostic items = 1;
  // Everything the VTY printed for the request, verbatim.
  string output = 2;

  // Why the call was refused, as a code a client acts on (#558). The VTY's
  // words stay in `items` and in the status message for a person; this is
  // read from them by the server, held to the VTY's own sentences by a test.
  enum Reason {
    REASON_UNSPECIFIED = 0;
    // The running configuration moved past the candidate's base since it was
    // opened: `running_revision` is where it is now. Open a new candidate
    // and apply again; nothing was run.
    REASON_STALE_BASE = 1;
    // The account's role does not allow it.
    REASON_PERMISSION = 2;
    // The candidate named was closed by the server for idleness
    // (ListCandidatesResponse.idle_seconds) - status NOT_FOUND.
    REASON_CANDIDATE_EXPIRED = 3;
    // The candidate named was never this account's, or was closed by a
    // CloseCandidate - status NOT_FOUND.
    REASON_CANDIDATE_UNKNOWN = 4;
    // A value is longer than the field it travels in: `limit_field`,
    // `limit` and `limit_size` (bytes).
    REASON_LIMIT = 5;
    // The VTY's gates: the change re-maps subscribers that have mappings, maps
    // pools differently from the HA peer, or stops advertising the prefix
    // carrying this session. Commit again with the matching acknowledge_*;
    // `gate_items` lists what the gate is about.
    REASON_GATE_REMAP = 6;
    REASON_GATE_DIVERGE = 7;
    REASON_GATE_CUTOFF = 8;
    // A `commit confirmed` window is in the way: it could not be confirmed,
    // or the box is still on an unconfirmed configuration whose revert
    // failed. GetPendingConfirm says which window.
    REASON_CONFIRM_PENDING = 9;
    // A line the VTY's grammar does not take, or a batch with such a line.
    REASON_GRAMMAR = 10;
    // The candidate is refused for what it means (a pool without its
    // prefixes, an overlap): `commit check` names the line.
    REASON_VALIDATION = 11;
    // The change was applied and failed (FRR refused a line); the box rolled
    // back to the previous state.
    REASON_APPLY_FAILED = 12;
    // The commit's own words were wrong (`confirmed` outside 1-60 minutes).
    REASON_USAGE = 13;
    // A refusal none of the above names; read the message.
    REASON_OTHER = 14;
  }
  Reason reason = 3;
  // REASON_STALE_BASE: the running revision the configuration moved to, the
  // one GetRunning answers now.
  string running_revision = 4;
  // REASON_LIMIT: the field ("cgnat identity file", "description"), its
  // limit and the size refused, in bytes.
  string limit_field = 5;
  uint32 limit = 6;
  uint32 limit_size = 7;
  // REASON_GATE_*: the subscribers, pools or prefixes the gate is about, as
  // CheckResponse lists them.
  repeated string gate_items = 8;
}

// A candidate configuration, as OpenCandidate returned it.
message CandidateRef {
  string candidate_id = 1;
}

// A configuration as the VTY's text.
message ConfigText {
  string text = 1;
  // The running revision this text was read at (see ListRevisions); empty for
  // a candidate.
  string revision = 2;
}

// ---------------------------------------------------------------- config

service ConfigService {
  // Opens a candidate for this call's account: a copy of the running
  // configuration, or of a committed revision when `from_revision` is set.
  rpc OpenCandidate(OpenCandidateRequest) returns (OpenCandidateResponse);
  // Applies lines to a candidate, at a hierarchy path, exactly as typed at
  // the prompt. A line the VTY refuses stages nothing and answers
  // INVALID_ARGUMENT with the refusal; the lines before it are kept.
  rpc Edit(EditRequest) returns (EditResponse);
  // The candidate's text, as `show running-config` would print it once
  // committed.
  rpc ShowCandidate(CandidateRef) returns (ConfigText);
  // The difference between the candidate and the running configuration,
  // as `show configuration compare` prints it.
  rpc Compare(CandidateRef) returns (CompareResponse);
  // `commit check`: everything the box would refuse or warn about, applied
  // nowhere.
  rpc Check(CandidateRef) returns (CheckResponse);
  // `commit`, with its options. Refused with FAILED_PRECONDITION when the
  // check refuses, or when the running configuration has changed since the
  // candidate was opened - the client opens a new candidate and re-applies.
  rpc Commit(CommitRequest) returns (CommitResponse);
  // Confirms a `commit confirmed` window, so the box does not roll back.
  rpc Confirm(ConfirmRequest) returns (ConfirmResponse);
  // Loads committed revision `n` into the candidate (`rollback <n>`); it is
  // applied by a Commit, as at the prompt.
  rpc Rollback(RollbackRequest) returns (EditResponse);
  // `save`: writes the running configuration to the file the boot loads.
  rpc Save(SaveRequest) returns (SaveResponse);
  // Discards a candidate.
  rpc CloseCandidate(CandidateRef) returns (CloseResponse);
  // The running configuration, as `show running-config` prints it.
  rpc GetRunning(GetRunningRequest) returns (ConfigText);
  // The committed revisions `rollback` can load, newest first.
  rpc ListRevisions(ListRevisionsRequest) returns (ListRevisionsResponse);
  // The `commit confirmed` window the box holds, if any (#558), read from the
  // box's own state - it is the same after the API server or a client
  // restarts, and for any account.
  rpc GetPendingConfirm(GetPendingConfirmRequest) returns (PendingConfirm);
  // This account's open candidates, with when each expires (#558).
  rpc ListCandidates(ListCandidatesRequest) returns (ListCandidatesResponse);

  // Typed configuration (#558, phase 2): interfaces, CGNAT pools and the
  // CGNAT log export as fields, read off the same parsed configuration the
  // VTY holds - the running one, or a candidate's.
  rpc GetConfig(GetConfigRequest) returns (TypedConfig);
  // Sets one object of a candidate to the fields given: the server writes
  // the VTY lines that take it there (returned in `lines`) and stages them
  // exactly as Edit would, so every refusal, gate and Diagnostics.reason of
  // the line form applies. `fields` limits the change to the fields named.
  rpc SetConfig(SetConfigRequest) returns (SetConfigResponse);
  // Removes one object from a candidate, as `no interface`, `no pool` or
  // `logging <transport> disable` does.
  rpc DeleteConfig(DeleteConfigRequest) returns (SetConfigResponse);
  // The grammar of these areas as the prompt's `?` answers it: each
  // statement, its forms and each argument's kind, range or choices.
  rpc GetSchema(GetSchemaRequest) returns (ConfigSchema);
  // Each line, at a hierarchy path, checked by the VTY in a throwaway
  // candidate: accepted or refused with its Diagnostics.reason. Nothing is
  // staged anywhere a client can see.
  rpc ValidateLines(ValidateLinesRequest) returns (ValidateLinesResponse);
}

message OpenCandidateRequest {
  // When set, the candidate starts as committed revision `from_revision`
  // (0 is the newest) rather than as the running configuration.
  optional uint32 from_revision = 1;
}

message OpenCandidateResponse {
  string candidate_id = 1;
  // The running revision the candidate was opened on. A Commit refuses a
  // candidate whose base the running configuration has moved past.
  string base_revision = 2;
  // The candidate's text as opened.
  string text = 3;
  // When the server closes it if nobody uses it (#558): every call naming
  // the candidate moves this to now + idle_seconds.
  google.protobuf.Timestamp expires_at = 4;
  uint32 idle_seconds = 5;
}

message EditRequest {
  string candidate_id = 1;
  // Where the lines apply, outermost first, as the prompt enters it:
  // ["nat", "cgnat", "pool RFC6598"]. Empty is the top of the configuration.
  repeated string path = 2;
  // The lines, each exactly as typed at that level ("block-size 256",
  // "no shutdown", "neighbor 192.0.2.1 remote-as 65000").
  repeated string lines = 3;
}

message EditResponse {
  // Notes and warnings the VTY printed for the accepted lines.
  repeated Diagnostic diagnostics = 1;
  string output = 2;
  // The candidate's activity after this call, and when it now expires
  // (#558).
  google.protobuf.Timestamp last_activity = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message CompareResponse {
  // `show configuration compare`'s text; empty when nothing differs.
  string diff = 1;
  bool changed = 2;
}

message CheckResponse {
  // True when a commit of this candidate would be applied.
  bool passed = 1;
  repeated Diagnostic diagnostics = 2;
  // Subscribers a change would move to other public addresses or blocks
  // (the VTY's `remap` gate): a Commit needs `acknowledge_remap`.
  repeated string remap = 3;
  // The prefix carrying this session the change would stop advertising
  // (`cutoff`): a Commit needs `acknowledge_cutoff`.
  repeated string cutoff = 4;
  // Pools the change would map differently from the HA peer (`diverge`):
  // a Commit needs `acknowledge_diverge`.
  repeated string diverge = 5;
  string output = 6;
  // When `passed` is false: what a Commit would be refused for, the code
  // Diagnostics.reason would carry (#558).
  Diagnostics.Reason reason = 7;
}

message CommitRequest {
  string candidate_id = 1;
  // `commit comment <text>`.
  string comment = 2;
  // `commit confirmed <minutes>`: the box rolls the change back unless a
  // Confirm arrives within this many minutes. 0 is a plain commit.
  uint32 confirmed_minutes = 3;
  // The VTY's gated words, said in as many words.
  bool acknowledge_remap = 4;
  bool acknowledge_cutoff = 5;
  bool acknowledge_diverge = 6;
}

message CommitResponse {
  // The running revision after the commit.
  string revision = 1;
  // When `confirmed_minutes` was set: the moment the box rolls back.
  google.protobuf.Timestamp confirm_deadline = 2;
  repeated Diagnostic diagnostics = 3;
  string output = 4;
}

message ConfirmRequest {}

message ConfirmResponse {
  repeated Diagnostic diagnostics = 1;
  string output = 2;
}

message RollbackRequest {
  string candidate_id = 1;
  // 0 is the newest committed revision.
  uint32 revision = 2;
}

message SaveRequest {}

message SaveResponse {
  string output = 1;
}

message CloseResponse {}

message GetRunningRequest {}

message ListRevisionsRequest {}

message Revision {
  uint32 number = 1;
  google.protobuf.Timestamp committed_at = 2;
  // The comment or the reason the VTY recorded ("loaded from file").
  string comment = 3;
}

message ListRevisionsResponse {
  repeated Revision revisions = 1;
}

message GetPendingConfirmRequest {}

// A `commit confirmed` window (#558).
message PendingConfirm {
  // False: no window; nothing below is set.
  bool pending = 1;
  // The running revision the box rolls back FROM - GetRunning's revision
  // while the window is open.
  string revision = 2;
  // When the box rolls back unless a Confirm (or any commit) arrives.
  google.protobuf.Timestamp deadline = 3;
  // Who committed it, and the commit's comment.
  string account = 4;
  string comment = 5;
  google.protobuf.Timestamp committed_at = 6;
  // The window's length as asked; 0 when this account cannot read the
  // window file (a read-only role), which does not change `deadline`.
  uint32 minutes = 7;
  // Reverts the box has tried and failed; non-zero is a box still on the
  // unconfirmed configuration past its deadline.
  uint32 revert_attempts = 8;
  // The deadline has passed and the window is still there.
  bool overdue = 9;
}

message ListCandidatesRequest {}

message CandidateInfo {
  string candidate_id = 1;
  // The running revision it was opened on.
  string base_revision = 2;
  google.protobuf.Timestamp created_at = 3;
  // The last call that named it; listing does not count.
  google.protobuf.Timestamp last_activity = 4;
  // last_activity + idle_seconds: the server closes it then.
  google.protobuf.Timestamp expires_at = 5;
  // Lines it adds or removes against its base, as `show configuration
  // compare` counts them.
  uint32 staged_lines = 6;
}

message ListCandidatesResponse {
  // Oldest first; only the calling account's.
  repeated CandidateInfo candidates = 1;
  // The server's idle rule: a candidate unused this long is closed.
  uint32 idle_seconds = 2;
}

// ---------------------------------------------------- typed configuration

message GetConfigRequest {
  // Empty reads the running configuration; set, that candidate's.
  string candidate_id = 1;
  // "interfaces", "pools", "logging"; empty is all three.
  repeated string areas = 2;
}

// An interface as its `interface <name>` block states it. A field at its
// default is a statement the block does not have.
message InterfaceConfig {
  string name = 1;
  // "port", "loopback", "bundle" or "subinterface" (read only).
  string kind = 2;
  string description = 3;
  // 0: no `mtu` statement, the box's default.
  uint32 mtu = 4;
  bool shutdown = 5;
  // "a.b.c.d/m", in the order written.
  repeated string ipv4 = 6;
  repeated string ipv6 = 7;
  // "", "inside" or "outside": `cgnat inside|outside`.
  string cgnat_role = 8;
  // 0: the default table, no `vrf` statement.
  uint32 vrf = 9;
  // "": the interface's own name (the pair is made under it).
  string linux_name = 10;
  // A sub-interface's tags (0: none); set only when creating one.
  uint32 vlan_outer = 11;
  uint32 vlan_inner = 12;
  string mac_address = 13;
  // "", "strict" or "loose".
  string urpf = 14;
  // `no ipv6 nd suppress-ra`: router advertisements are sent.
  bool router_advertisements = 15;
}

message PortForwardConfig {
  // "tcp" or "udp".
  string protocol = 1;
  uint32 public_port = 2;
  string private_address = 3;
  uint32 private_port = 4;
}

// A CGNAT pool as its `pool <name>` block states it.
message PoolConfig {
  string name = 1;
  repeated string prefix_inside = 2;
  repeated string prefix_outside = 3;
  uint32 block_size = 4;
  // Both 0: the device's own port range (no `ports` statement).
  uint32 port_first = 5;
  uint32 port_last = 6;
  // "interleaved" or "blocked".
  string policy = 7;
  // "deterministic" or "dynamic".
  string mode = 8;
  // Unset: every VRF (no statement), which is not VRF 0.
  optional uint32 vrf = 9;
  optional uint32 outside_vrf = 10;
  // Overrides only, seconds, by name ("udp", "icmp", "tcp-syn", "gre",
  // "tcp-transitory", "tcp-established", "port-holddown", "alg-expect").
  map<string, uint32> timeouts = 11;
  // 1: one block per subscriber, the default.
  uint32 max_blocks = 12;
  // Ports; 0: one block.
  uint32 initial_allocation = 13;
  uint32 block_stride = 14;
  uint32 reserve = 15;
  repeated string bypass_source = 16;
  repeated string bypass_destination = 17;
  // Percent; 0: off.
  uint32 utilisation_alarm = 18;
  // 0: unlimited.
  uint32 max_sessions = 19;
  uint32 max_session_rate = 20;
  // "": off; "auto"; or a number of bytes.
  string tcp_mss = 21;
  // "endpoint-independent" or "address-dependent".
  string filter = 22;
  // Only the ALGs the operator chose ("ftp", "rtsp", "pptp", "esp", "sip").
  map<string, bool> algs = 23;
  repeated PortForwardConfig forwards = 24;
}

// One CGNAT log stream's collector, as `logging <transport> ...` states it.
message LogCollectorConfig {
  // "udp" (IPFIX), "tcp" (IPFIX over TCP) or "syslog" (RFC 5424 over TCP).
  string transport = 1;
  // false: no collector (`logging <transport> disable`, or never set).
  bool configured = 2;
  string collector = 3;
  // 0: the transport's default port.
  uint32 port = 4;
  // udp only: the source address the export leaves from (`src`).
  string source = 5;
  // syslog only: the structured-data enterprise number.
  uint32 enterprise = 6;
  // syslog only; unset: the box's defaults.
  optional uint32 facility = 7;
  optional uint32 severity = 8;
}

message LoggingConfig {
  // `logging enable`: UDP export on.
  bool enabled = 1;
  // Always the three, udp, tcp, syslog, in that order, on a read.
  repeated LogCollectorConfig collectors = 2;
}

message TypedConfig {
  // "running" or "candidate".
  string source = 1;
  // The running revision read (empty for a candidate).
  string revision = 2;
  string candidate_id = 3;
  repeated InterfaceConfig interfaces = 4;
  repeated PoolConfig pools = 5;
  LoggingConfig logging = 6;
}

message SetConfigRequest {
  string candidate_id = 1;
  oneof object {
    InterfaceConfig interface = 2;
    PoolConfig pool = 3;
    LoggingConfig logging = 4;
  }
  // The fields to change, by their names in the message above ("mtu",
  // "ipv4", "collectors"; "ports" for port_first/port_last, "vlan" for the
  // tags); empty changes every field to the value given.
  repeated string fields = 5;
}

message SetConfigResponse {
  // Where the lines were staged, and the lines, as Edit would take them.
  repeated string path = 1;
  repeated string lines = 2;
  repeated Diagnostic diagnostics = 3;
  string output = 4;
  google.protobuf.Timestamp last_activity = 5;
  google.protobuf.Timestamp expires_at = 6;
}

message DeleteConfigRequest {
  string candidate_id = 1;
  // "interfaces", "pools" or "logging".
  string area = 2;
  // The interface or pool.
  string name = 3;
  // logging: "udp", "tcp" or "syslog".
  string transport = 4;
}

message GetSchemaRequest {
  // Empty is all three areas.
  repeated string areas = 1;
}

message SchemaArgument {
  // As the prompt shows it: "<64-32768>", "src", "<A.B.C.D/M>".
  string name = 1;
  // "integer", "ipv4_prefix", "ipv4_address", "ipv6_prefix", "address",
  // "mac", "choice", "word", "text" (the rest of the line) or "keyword"
  // (the literal word itself).
  string kind = 2;
  // integer: the range, inclusive (0/0 when the grammar states none).
  int64 min = 3;
  int64 max = 4;
  // choice: the values.
  repeated string choices = 5;
  bool optional = 6;
}

message SchemaForm {
  repeated SchemaArgument arguments = 1;
}

message SchemaStatement {
  // The statement's words, e.g. ["timeout", "udp"], ["ipv4", "address"].
  repeated string words = 1;
  string help = 2;
  // One per alternative ("<collector> ... | disable" is two).
  repeated SchemaForm forms = 3;
  // Whether `no <words>` removes it.
  bool removable = 4;
}

message SchemaArea {
  string area = 1;
  // Where its lines are typed, as EditRequest.path, "<name>" a placeholder.
  repeated string path = 2;
  repeated SchemaStatement statements = 3;
  // What "<name>" may be today: the interfaces or pools configured.
  repeated string names = 4;
}

message ConfigSchema {
  repeated SchemaArea areas = 1;
}

message ValidateLinesRequest {
  repeated string path = 1;
  repeated string lines = 2;
}

message LineVerdict {
  string line = 1;
  bool ok = 2;
  // When refused: the same code Edit would carry (GRAMMAR, LIMIT, ...).
  Diagnostics.Reason reason = 3;
  // The VTY's words, accepted or refused.
  string message = 4;
}

message ValidateLinesResponse {
  repeated LineVerdict verdicts = 1;
}

// ----------------------------------------------------------- operational

// Typed operational data, read by the same readers the VTY's `show`
// commands use. What is not typed yet is reachable through Show.
service OperationalService {
  rpc GetVersion(GetVersionRequest) returns (VersionInfo);
  rpc GetSystem(GetSystemRequest) returns (SystemInfo);
  rpc ListInterfaces(ListInterfacesRequest) returns (ListInterfacesResponse);
  rpc ListPools(ListPoolsRequest) returns (ListPoolsResponse);
  rpc GetSubscriber(GetSubscriberRequest) returns (Subscriber);
  rpc GetSessionsSummary(GetSessionsSummaryRequest) returns (SessionsSummary);
  rpc ListBgpNeighbors(ListBgpNeighborsRequest) returns (ListBgpNeighborsResponse);
  rpc ListOspfNeighbors(ListOspfNeighborsRequest) returns (ListOspfNeighborsResponse);
  rpc ListIsisAdjacencies(ListIsisAdjacenciesRequest) returns (ListIsisAdjacenciesResponse);
  rpc ListVrrp(ListVrrpRequest) returns (ListVrrpResponse);
  rpc ListBundles(ListBundlesRequest) returns (ListBundlesResponse);
  // Routing policy (#538). Every policy-statement the box runs, with its
  // terms, its text as typed under `policy-options` and where it is
  // applied: `show policy`.
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  // How many routes each term matched, at each place a policy is applied,
  // from FRR's route-map counters: `show policy <name>`.
  rpc GetPolicyCounters(GetPolicyCountersRequest) returns (GetPolicyCountersResponse);
  // What a policy does with a route - described, or read off the box - at
  // a use, simulated as FRR runs the map: `test policy <p> route|rib`.
  rpc TestPolicy(TestPolicyRequest) returns (TestPolicyResponse);
  // Any operational command the VTY takes (`show ...`, `ping ...`), with
  // its text exactly as the VTY prints it. Configuration and shell commands
  // are refused, and so is `monitor`, which redraws a terminal a call has not
  // got - TelemetryService is the API's live view.
  rpc Show(ShowRequest) returns (ShowResponse);
  // The CGNAT log export (#555): each stream - syslog and IPFIX over TCP,
  // IPFIX over UDP - who carries it, its collector, its counters and whether
  // it is delivering, read from the same screen as `show cgnat logging`.
  rpc GetLogging(GetLoggingRequest) returns (LoggingState);
}

message GetVersionRequest {}

message VersionInfo {
  // The installed release ("0.148.5").
  string release = 1;
  // The build of the plugin the running dataplane loaded.
  string plugin_build = 2;
  // False when the dataplane runs a plugin other than the installed release
  // (the box was upgraded and not rebooted).
  bool dataplane_current = 3;
  string vpp_version = 4;
  string frr_version = 5;
  string hostname = 6;
  // How the VTY reaches the dataplane: "vpp_papi" or "vat2".
  string api_transport = 7;
}

message GetSystemRequest {}

message SystemInfo {
  string hostname = 1;
  uint64 uptime_seconds = 2;
  // The `system cpu` layout this boot runs.
  string control_plane_cpus = 3;
  string main_thread_cpu = 4;
  string worker_cpus = 5;
  uint32 workers = 6;
  // 1G hugepages reserved now.
  uint32 hugepages = 7;
  // `show system cpu` and `show system memory`, verbatim.
  string cpu_text = 8;
  string memory_text = 9;
  // Since when each part of the box runs (#534, 0.148.7), as
  // `show system uptime` reads them; a field left unset was not read.
  // The kernel's boot.
  google.protobuf.Timestamp boot_time = 10;
  // The dataplane (VPP), from VPP's own clock.
  google.protobuf.Timestamp dataplane_started = 11;
  // The routing daemons (FRR).
  google.protobuf.Timestamp control_plane_started = 12;
  // The VTY's management container; unset when the VTY runs on the host.
  google.protobuf.Timestamp vty_started = 13;
  // Why the box last booted, only as recorded: "system reboot by <account>",
  // "system shutdown by <account>", or "not recorded" (a power cut, a
  // hypervisor, a reboot from a shell). Never a guess.
  string last_boot_reason = 14;
  // When the release the box runs was installed or upgraded to.
  google.protobuf.Timestamp release_installed_at = 15;
  // True when the dataplane started more than five minutes after the box:
  // it restarted on its own since the boot.
  bool dataplane_restarted = 16;
  // The host's RAM as numbers (#533), from the kernel's meminfo: what it
  // has, and what is not available to a new allocation - MemTotal less
  // MemAvailable, so the hugepages the dataplane reserved count as used.
  uint64 memory_total_bytes = 17;
  uint64 memory_used_bytes = 18;
  // Of the used, the 1G hugepages reserved for the dataplane.
  uint64 memory_hugepages_bytes = 19;
  // How loaded each dataplane worker is (#533). A polling worker's CPU is
  // always 100%; these are what the dataplane itself counts.
  repeated WorkerLoad worker_load = 20;
}

// One dataplane worker's load, from the dataplane's statistics segment.
message WorkerLoad {
  // The worker's number: 0 is the dataplane's vpp_wk_0.
  uint32 worker = 1;
  // The CPU it runs on, from `show system cpu`'s this-boot layout; with no
  // layout read, the worker's number.
  uint32 cpu = 2;
  // Packets per call of a graph node over the dataplane's last interval
  // (VPP's /sys/vector_rate_per_worker, whole vectors): near 0 idle, up to
  // 256 when every call takes a full frame.
  double vectors_per_call = 3;
  // The share of the worker's node time its graph took, 0 to 1, over the
  // window below: the clocks of the nodes that run only with packets, over
  // every node's - the input nodes' polling included - from `show
  // runtime`. Not the receive inside the input node, which shares its
  // clocks with the polling, so a worker that cannot keep up reads below 1:
  // 0.49 for the lab's worker saturated by a packet generator. A worker running under 1,000 loops
  // a second is waiting for interrupts, not polling: 0, and
  // vectors_per_call 0 with it.
  double busy_ratio = 4;
  // The main loop's rate (VPP's /sys/loops_per_worker); the dataplane
  // updates it, and vectors_per_call, every 10 s.
  double loops_per_second = 5;
  // The window busy_ratio was measured over, in milliseconds: since the
  // server's previous reading, at least a second and at most a minute.
  uint32 busy_window_ms = 6;
}

message ListInterfacesRequest {
  // Only these interfaces; empty is all of them.
  repeated string names = 1;
}

message InterfaceCounters {
  uint64 rx_bytes = 1;
  uint64 tx_bytes = 2;
  uint64 rx_packets = 3;
  uint64 tx_packets = 4;
  uint64 rx_errors = 5;
  uint64 tx_errors = 6;
  uint64 drops = 7;
}

message Interface {
  string name = 1;
  bool admin_up = 2;
  bool link_up = 3;
  uint32 mtu = 4;
  string mac_address = 5;
  // Addresses with prefix length, both families ("10.40.200.166/24").
  repeated string addresses = 6;
  // The Linux end of the pair, when the interface has one.
  string linux_name = 7;
  string description = 8;
  InterfaceCounters counters = 9;
  // The link's speed as the dataplane reports it (#533), for utilisation in
  // percent; 0 when it reports none (a link that is down, a virtual one).
  uint64 speed_bps = 10;
}

message ListInterfacesResponse {
  repeated Interface interfaces = 1;
}

message ListPoolsRequest {}

message Pool {
  string name = 1;
  // "dynamic" or "deterministic".
  string mode = 2;
  // "interleaved" or "blocked".
  string policy = 3;
  uint32 block_size = 4;
  repeated string prefixes_inside = 5;
  repeated string prefixes_outside = 6;
  // Subscribers the pool can hold, and the number it holds whatever the
  // addresses are (the per-worker floor, #210).
  uint64 capacity = 7;
  uint64 guaranteed = 8;
  uint64 subscribers = 9;
  uint64 ports_in_use = 10;
  uint64 refusals = 11;
  uint64 sessions = 12;
}

message ListPoolsResponse {
  repeated Pool pools = 1;
}

message GetSubscriberRequest {
  // The subscriber's inside address.
  string address = 1;
}

message PortBlock {
  string public_address = 1;
  uint32 first_port = 2;
  uint32 last_port = 3;
}

message Subscriber {
  string address = 1;
  string pool = 2;
  repeated PortBlock blocks = 3;
  uint64 sessions = 4;
  // `show cgnat subscriber <address>`, verbatim.
  string text = 5;
}

message GetSessionsSummaryRequest {}

message SessionsSummary {
  uint64 sessions = 1;
  // Sessions the dataplane's memory holds room for.
  uint64 sessions_fit = 2;
  uint64 subscribers = 3;
  uint64 ports_in_use = 4;
}

message ListBgpNeighborsRequest {}

message BgpNeighbor {
  string vrf = 1;
  // The peer's address, or the interface for an unnumbered session.
  string peer = 2;
  uint32 remote_as = 3;
  // FRR's state name: "Established", "Active", "Idle", ...
  string state = 4;
  uint64 uptime_seconds = 5;
  uint64 prefixes_received = 6;
  string description = 7;
}

message ListBgpNeighborsResponse {
  repeated BgpNeighbor neighbors = 1;
}

message ListOspfNeighborsRequest {}

message OspfNeighbor {
  // "ospf" or "ospf6".
  string protocol = 1;
  string router_id = 2;
  string address = 3;
  string interface = 4;
  // FRR's state, e.g. "Full/DR".
  string state = 5;
}

message ListOspfNeighborsResponse {
  repeated OspfNeighbor neighbors = 1;
}

message ListIsisAdjacenciesRequest {}

message IsisAdjacency {
  string system_id = 1;
  string interface = 2;
  string state = 3;
  string level = 4;
}

message ListIsisAdjacenciesResponse {
  repeated IsisAdjacency adjacencies = 1;
}

message ListVrrpRequest {}

message VrrpRouter {
  string interface = 1;
  uint32 vr_id = 2;
  // 4 or 6.
  uint32 family = 3;
  // "master", "backup", "initialize" or "interface down".
  string state = 4;
  uint32 priority = 5;
  repeated string addresses = 6;
}

message ListVrrpResponse {
  repeated VrrpRouter routers = 1;
}

message ListBundlesRequest {}

message Bundle {
  string name = 1;
  string mode = 2;
  repeated string members = 3;
  repeated string active_members = 4;
}

message ListBundlesResponse {
  repeated Bundle bundles = 1;
}

message ListPoliciesRequest {}

message PolicyTerm {
  string name = 1;
  // "accept", "reject", "next term", "next policy", or "" when it has none.
  string then = 2;
  // The term's statements as typed under it: "from prefix-list C".
  repeated string lines = 3;
}

message Policy {
  string name = 1;
  repeated PolicyTerm terms = 2;
  // "accept", "reject", or "" when it has none.
  string default_action = 3;
  // The `policy-options` block of this policy, as the VTY prints it.
  string text = 4;
  // Where the running routing applies it, as `show policy` says it.
  repeated string applied = 5;
}

message ListPoliciesResponse {
  repeated Policy policies = 1;
}

message GetPolicyCountersRequest {
  // One policy; empty is every policy.
  string policy = 1;
}

message PolicyTermHits {
  // The policy and term: term "" is the policy's default-action, and both
  // "" the use's own default.
  string policy = 1;
  string term = 2;
  // The routes the term's clauses matched - each time the daemon ran the
  // map, so a route evaluated again counts again.
  uint64 hits = 3;
  // False for a term that compiled to no clause at this use.
  bool compiled = 4;
}

message PolicyUseCounters {
  // The policy, or the chain ("A+B"), the route-map is.
  string policy = 1;
  // The use, as `test policy ... at` takes it: "import", "fib static".
  string attach_point = 2;
  // Every place that applies it: one route-map, shared counts.
  repeated string applied_at = 3;
  string route_map = 4;
  // The FRR daemon that runs the map: bgpd, ospfd, isisd or zebra.
  string daemon = 5;
  // The map a `from policy` term calls.
  bool called = 6;
  // False when the daemon reported no such map: no counter, not zero.
  bool counted = 7;
  repeated PolicyTermHits terms = 8;
}

message GetPolicyCountersResponse {
  repeated PolicyUseCounters uses = 1;
}

message TestPolicyRequest {
  // A policy, or a chain ("A+B").
  string policy = 1;
  string prefix = 2;
  // As `at` takes it: "import" (the default), "export", "table",
  // "vrf-import", "ospf static", "fib bgp", ...
  string attach_point = 3;
  // A described route: attribute -> value, the words `test policy ...
  // route` takes ("community" -> "65001:10 65001:20"). A list not given is
  // none, a value not given is not known.
  map<string, string> attributes = 4;
  // Read the route off the box instead (`rib`): attributes are ignored.
  bool rib = 5;
  string vrf = 6;
  // At an import, whose path; at an export, where it goes.
  string neighbor = 7;
}

message TestPolicyStep {
  string policy = 1;
  // "" for a default.
  string term = 2;
  // "match", "no match" or "unknown".
  string outcome = 3;
  string why = 4;
}

message TestPolicyResponse {
  // "accept" or "reject".
  string verdict = 1;
  // As the VTY says it: "term cust", "A's default-action", ...
  string decided_by = 2;
  string decided_policy = 3;
  string decided_term = 4;
  string attach_point = 5;
  string route_map = 6;
  string daemon = 7;
  // The route simulated, and after the sets when accepted: attribute ->
  // value, lists joined by spaces.
  map<string, string> route = 8;
  map<string, string> route_after = 9;
  repeated TestPolicyStep steps = 10;
  // The conditions the route did not say, taken as not matching: the
  // answer holds only if they do not.
  repeated string assumed = 11;
  // Where the route came from, and what of it is not known.
  repeated string notes = 12;
  // Sets that change nothing at this use.
  repeated string said = 13;
  // What the box refuses about this policy at this use.
  repeated string refused = 14;
}

message ShowRequest {
  // The command as typed at the operational prompt ("show bgp summary").
  string command = 1;
}

message ShowResponse {
  string text = 1;
}

// ---------------------------------------------- the CGNAT log export (#555)
//
// Read from `show bpa logging` - the screen `show cgnat logging` prints - so
// the API and the prompt can never disagree. COUNTERS ("counter" below) count
// up from the dataplane's start and are those of the stream's CURRENT
// carrier: when a stream moves between the log container and the dataplane
// (#550) a counter may jump or start again, and a client takes a decrease as
// a reset. GAUGES ("gauge") are what is true now. Absent figures are 0: a
// stream that is not configured has configured false and every other field
// empty or 0.

message GetLoggingRequest {}

message LogStream {
  // "syslog" (RFC 5424 over TCP), "ipfix-tcp" (RFC 8158 over TCP),
  // "ipfix-udp" (RFC 8158 over UDP).
  string kind = 1;
  bool configured = 2;
  // "address:port" of the collector; empty when not configured.
  string collector = 3;
  // The source address the UDP export is sent from; empty for TCP streams.
  string source = 4;
  // "log-container" or "dataplane" (#550); empty when not configured.
  string carrier = 5;
  // Why the dataplane sends a stream the log container could (a VRF, a
  // source it could not bind); empty otherwise.
  string carrier_reason = 6;
  // TCP: "connected", "connecting" or "disconnected". Empty for UDP.
  string connection = 7;
  // Counter: records the carrier wrote (syslog lines, IPFIX records).
  uint64 records = 8;
  // Counter: bytes the TCP connection took. 0 for UDP.
  uint64 bytes_sent = 9;
  // Counter: UDP datagrams the log container sent; 0 when the dataplane
  // sends them (the dataplane counts records, not packets) and for TCP.
  uint64 packets_sent = 10;
  // Gauge: bytes waiting in memory for the collector. TCP only.
  uint64 pending_bytes = 11;
  // Gauge: the spill file's size now. TCP only.
  uint64 spill_bytes = 12;
  // The spill file's cap, in bytes (256 MiB). TCP only.
  uint64 spill_cap_bytes = 13;
  // Counter: bytes dropped because the spill file was at its cap.
  uint64 dropped_over_cap = 14;
  // Counter: UDP sends the log container's socket refused.
  uint64 send_failures = 15;
  // Counter: records this stream dropped (nowhere to write them).
  uint64 dropped = 16;
  // The server's verdict, by the rule docs/api.md gives: false when the
  // stream has had something waiting (TCP) or failing (UDP) and delivered
  // nothing for a minute. A stream with nothing to send is delivering.
  bool delivering = 17;
  // Why it is not delivering; empty when it is.
  string stalled_reason = 18;
  // When the stream last got something out, or last had nothing to send.
  google.protobuf.Timestamp last_progress = 19;
}

message LoggingState {
  // When the screen was read.
  google.protobuf.Timestamp at = 1;
  // syslog, ipfix-tcp, ipfix-udp - always all three, in that order.
  repeated LogStream streams = 2;
  // Who carries the TCP streams: "log-container" or "dataplane".
  string carrier = 3;
  // The log container's process id while it carries them; 0 otherwise.
  uint32 logger_pid = 4;
  // Counter: events dropped because the log container's ring was full.
  uint64 export_ring_dropped = 5;
  // Counter: events dropped because a worker's queue was full.
  uint64 worker_queue_dropped = 6;
  // Counter: exhaustion events not reported, once a subscriber per 10 s
  // (#549) - expected under exhaustion, not a loss.
  uint64 exhaustion_repeats_not_reported = 7;
  // Counter: packets the interface toward the IPFIX collector failed to
  // send - FROM EVERY SENDER on it, forwarded traffic included.
  uint64 transmit_failed = 8;
  // That interface's name; empty when none reaches the collector.
  string transmit_interface = 9;
  // True when the event rings are in their shared segment, outside the
  // dataplane's heap (#550); false when the box fell back to the heap.
  bool rings_shared = 10;
  // The screen itself, verbatim, as `show cgnat logging` prints it.
  string text = 11;
}

// ------------------------------------------------------------- telemetry

service TelemetryService {
  // A stream of updates until the client cancels it.
  rpc Subscribe(SubscribeRequest) returns (stream TelemetryUpdate);
  // The counters the server sampled (#533), oldest first, one sample a
  // minute for the last 24 hours: so a client that restarts does not start
  // its graphs from zero. Streamed, one message a sample, because a day of
  // every interface is more than one message should carry.
  rpc GetHistory(GetHistoryRequest) returns (stream HistorySample);
}

message SubscribeRequest {
  // How often counters are sampled, in milliseconds; at least 500.
  uint32 interval_ms = 1;
  // Interface counters, from the dataplane's statistics segment.
  bool interface_counters = 2;
  // Only these interfaces; empty is all of them.
  repeated string interfaces = 3;
  // The CGNAT's totals.
  bool cgnat_totals = 4;
  // Configuration events: commits, confirm windows, rollbacks.
  bool events = 5;
  // The CGNAT log export's events (#555), as Events whose kind starts
  // "log-": "log-connected", "log-disconnected", "log-carrier",
  // "log-spill", "log-spill-full", "log-stalled", "log-delivering". The
  // server reads the export every 10 s, so an event can be that late.
  bool logging_events = 6;
}

message InterfaceSample {
  string name = 1;
  InterfaceCounters counters = 2;
}

message CgnatTotals {
  uint64 subscribers = 1;
  uint64 ports_in_use = 2;
  uint64 sessions = 3;
  uint64 refusals = 4;
}

message Event {
  // "commit", "confirm-pending", "confirmed", "rolled-back", "saved"; and
  // the log export's "log-..." kinds (#555, SubscribeRequest.logging_events).
  string kind = 1;
  string account = 2;
  string text = 3;
  // The running revision the event left (#533): for a commit, the same id
  // its CommitResponse.revision and GetRunning's revision carry, so a
  // client tells its own commits from somebody else's. Empty when the box
  // did not record one (a release before 0.149.2 wrote none).
  string revision = 4;
  // The commit's comment, or the reason the box recorded ("loaded from
  // file"); empty for none.
  string comment = 5;
}

message TelemetryUpdate {
  google.protobuf.Timestamp at = 1;
  oneof update {
    // One sample of every requested interface, taken together.
    InterfaceBatch interfaces = 2;
    CgnatTotals cgnat = 3;
    Event event = 4;
  }
}

message InterfaceBatch {
  repeated InterfaceSample samples = 1;
}

message GetHistoryRequest {
  // Only these interfaces; empty is every interface the server recorded.
  repeated string interfaces = 1;
  // Only samples taken after this; unset is everything held.
  google.protobuf.Timestamp since = 2;
  bool interface_counters = 3;
  bool cgnat_totals = 4;
  bool workers = 5;
  bool memory = 6;
}

// One minute's sample. Counters are the dataplane's running totals, as
// Subscribe sends them: a client takes differences, and a total smaller
// than the one before is a dataplane that restarted.
message HistorySample {
  google.protobuf.Timestamp at = 1;
  repeated InterfaceSample interfaces = 2;
  CgnatTotals cgnat = 3;
  repeated WorkerLoad workers = 4;
  uint64 memory_used_bytes = 5;
}

// ---------------------------------------------------------------- routes

// The routing table, typed (#533): FRR's RIB, every VRF and both families,
// read the way `show ip route` reads it.
service RouteService {
  // The routes, a page at a time. The first call (no page_token) takes a
  // snapshot of the table and answers its first page as soon as it is
  // read, while the rest is still being read; each next_page_token
  // continues the same snapshot, so a table that changes while it is paged
  // is not paged twice or with holes. A snapshot nobody pages for 10
  // minutes is dropped, and its token answers FAILED_PRECONDITION.
  rpc ListRoutes(ListRoutesRequest) returns (ListRoutesResponse);
  // How many routes each VRF holds, by family and protocol, in the RIB and
  // in the FIB: zebra's own count, cheap on a full table.
  rpc GetRouteSummary(GetRouteSummaryRequest) returns (GetRouteSummaryResponse);
}

message ListRoutesRequest {
  // One VRF ("default", "red"); empty is every VRF.
  string vrf = 1;
  // 4 or 6; 0 is both.
  uint32 family = 2;
  // Only this prefix and the ones inside it ("10.0.0.0/8").
  string prefix = 3;
  // Only routes of this protocol, FRR's word: "bgp", "ospf", "ospf6",
  // "isis", "static", "connected", "local", "kernel", ...
  string protocol = 4;
  // Only the routes FRR selected.
  bool selected_only = 5;
  // Routes per page: default 1000, at most 5000.
  uint32 page_size = 6;
  // next_page_token from the call before; empty starts a snapshot. The
  // filters above are the snapshot's, and a token ignores them.
  string page_token = 7;
}

message RouteNextHop {
  // The gateway; empty for a route straight onto an interface.
  string address = 1;
  string interface = 2;
  // FRR uses it, and installed it in the FIB.
  bool active = 3;
  bool fib = 4;
  uint32 weight = 5;
  bool directly_connected = 6;
  // The VRF the next hop is in, when it is not the route's (a leaked route).
  string vrf = 7;
  // "blackhole", "reject" or "" for a forwarding next hop.
  string blackhole = 8;
}

message Route {
  string vrf = 1;
  string prefix = 2;
  // 4 or 6.
  uint32 family = 3;
  string protocol = 4;
  uint32 distance = 5;
  uint32 metric = 6;
  // FRR's choice among the routes to this prefix.
  bool selected = 7;
  // In the FIB.
  bool installed = 8;
  repeated RouteNextHop next_hops = 9;
  // The kernel table the VRF installs into.
  uint32 table = 10;
  // How long FRR has held it, as FRR's uptime says it.
  uint64 age_seconds = 11;
}

message ListRoutesResponse {
  repeated Route routes = 1;
  // Empty when this page is the snapshot's last.
  string next_page_token = 2;
  // The routes the whole snapshot matched, once it has all been read;
  // until then 0, and total_known false.
  uint64 total = 3;
  bool total_known = 4;
  // When the snapshot was taken.
  google.protobuf.Timestamp snapshot_at = 5;
}

message GetRouteSummaryRequest {
  // One VRF; empty is every VRF.
  string vrf = 1;
}

message RouteCount {
  string vrf = 1;
  uint32 family = 2;
  string protocol = 3;
  uint64 rib = 4;
  uint64 fib = 5;
}

message GetRouteSummaryResponse {
  repeated RouteCount counts = 1;
}

// --------------------------------------------------------------- session

// What a client is to the box (#533).
service SessionService {
  // The account this call acts as - its client certificate's Common Name -
  // and the role the VTY login gives it, without opening a candidate.
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);
}

message WhoAmIRequest {}

message WhoAmIResponse {
  string account = 1;
  // "administrator", "cgnat-operator" or "read-only", the VTY's words.
  string role = 2;
  // What the role may change: the whole configuration, or the CGNAT half.
  bool can_configure = 3;
  bool can_configure_cgnat = 4;
}
