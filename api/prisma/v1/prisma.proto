  string decided_policy = 3;
  string decided_term = 4;
  string attach_point = 5;
  string route_map = 6;
  string daemon = 7;
  // The route simulated, and after the sets when accepted: attribute ->
  // value, lists joined by spaces.
  map<string, string> route = 8;
  map<string, string> route_after = 9;
  repeated TestPolicyStep steps = 10;
  // The conditions the route did not say, taken as not matching: the
  // answer holds only if they do not.
  repeated string assumed = 11;
  // Where the route came from, and what of it is not known.
  repeated string notes = 12;
  // Sets that change nothing at this use.
  repeated string said = 13;
  // What the box refuses about this policy at this use.
