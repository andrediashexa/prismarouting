// Prisma Routing management API, version 1 (#532).
//
// WHAT THIS IS. The contract a management client - the web interface's Rust
// backend first (tonic) - speaks to a box. It drives the VTY's own model: the
// candidate, `show configuration compare`, `commit check`, `commit`,
// `commit confirmed`, `rollback`, `save`, through the same code `prismash`
// runs, so a refusal here is the VTY's refusal in the VTY's words, and a
// change made here shows in `show running-config` at the prompt.
//
// CONFIGURATION TRAVELS AS THE VTY'S OWN TEXT. A candidate is edited with the
// lines an operator types (`block-size 256` under `nat` /
// `cgnat` / `pool X`), and read back as the text `show running-config`
// prints. Nothing here models a configuration statement as a message:
// modelling the grammar a second time is how two descriptions of one box
// drift apart. What IS typed is the operations and the operational data.
//
// COMPATIBILITY RULES, for every message and service in package prisma.v1:
//   * a field is only ever ADDED, with a number never used before in that
//     message; a field is never renumbered, retyped or reused;
//   * a field that stops being filled is marked `reserved`, never deleted
//     and re-numbered;
//   * an rpc or an enum value is only ever added;
//   * services are grouped by subject: a new rpc goes into the service its
//     subject belongs to, and a new service only comes with a new subject
//     (RouteService, SessionService, #533). A client generated with stubs
//     that answer UNIMPLEMENTED by default (tonic's
//     generate_default_stubs) keeps building when an rpc is added to a
//     service it implements;
//   * anything else - a removed field, a changed meaning, a renamed rpc - is
//     a breaking change and goes into package prisma.v2, served beside v1.
// A client built against an older prisma.v1 keeps working against a newer
// box; it does not see the fields it does not know.
//
// ERRORS. A call that is refused answers a gRPC status - INVALID_ARGUMENT for
// a line the VTY refuses, FAILED_PRECONDITION for a commit the box refuses or
// a candidate whose base the running configuration has moved past,
// PERMISSION_DENIED for an account without the role, NOT_FOUND for a
// candidate that does not exist, UNAVAILABLE when the dataplane does not
// answer - and carries the VTY's own account of it in the trailing metadata
// key `prisma-diagnostics-bin`: a serialized `Diagnostics` message. A
// `commit check` that finds problems is NOT an error: answering that is its
// job, and it returns them in `CheckResponse`.
//
// IDENTITY. The box account a call acts as is the Common Name of the client
// certificate the mutual-TLS handshake presented; it has the roles the VTY
// login gives that account, and every change is recorded in the
// configuration trail as made by it. See docs/api.md.

syntax = "proto3";

package prisma.v1;

import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------- common

// One thing the VTY said about a request: a refusal, a warning or a note,
// with the configuration path it is about when it names one.
message Diagnostic {
  enum Severity {
    SEVERITY_UNSPECIFIED = 0;
    SEVERITY_ERROR = 1;
    SEVERITY_WARNING = 2;
    SEVERITY_NOTE = 3;
  }
  Severity severity = 1;
  // The VTY's message, as it prints it, without the "error: " prefix.
  string message = 2;
  // The hierarchy the message is about, outermost first, e.g.
  // ["nat", "cgnat", "pool RFC6598"]; empty when it names none.
  repeated string path = 3;
  // The configuration line it is about, when it names one.
  string line = 4;
}

// What travels in `prisma-diagnostics-bin` on a refused call.
message Diagnostics {
  repeated Diagnostic items = 1;
  // Everything the VTY printed for the request, verbatim.
  string output = 2;

  // Why the call was refused, as a code a client acts on (#558). The VTY's
  // words stay in `items` and in the status message for a person; this is
  // read from them by the server, held to the VTY's own sentences by a test.
  enum Reason {
    REASON_UNSPECIFIED = 0;
    // The running configuration moved past the candidate's base since it was
    // opened: `running_revision` is where it is now. Open a new candidate
    // and apply again; nothing was run.
    REASON_STALE_BASE = 1;
    // The account's role does not allow it.
    REASON_PERMISSION = 2;
    // The candidate named was closed by the server for idleness
    // (ListCandidatesResponse.idle_seconds) - status NOT_FOUND.
    REASON_CANDIDATE_EXPIRED = 3;
    // The candidate named was never this account's, or was closed by a
    // CloseCandidate - status NOT_FOUND.
    REASON_CANDIDATE_UNKNOWN = 4;
    // A value is longer than the field it travels in: `limit_field`,
    // `limit` and `limit_size` (bytes).
    REASON_LIMIT = 5;
    // The VTY's gates: the change re-maps subscribers that have mappings, maps
    // pools differently from the HA peer, or stops advertising the prefix
    // carrying this session. Commit again with the matching acknowledge_*;
    // `gate_items` lists what the gate is about.
    REASON_GATE_REMAP = 6;
    REASON_GATE_DIVERGE = 7;
    REASON_GATE_CUTOFF = 8;
    // A `commit confirmed` window is in the way: it could not be confirmed,
    // or the box is still on an unconfirmed configuration whose revert
    // failed. GetPendingConfirm says which window.
    REASON_CONFIRM_PENDING = 9;
    // A line the VTY's grammar does not take, or a batch with such a line.
    REASON_GRAMMAR = 10;
    // The candidate is refused for what it means (a pool without its
    // prefixes, an overlap): `commit check` names the line.
    REASON_VALIDATION = 11;
    // The change was applied and failed (FRR refused a line); the box rolled
    // back to the previous state.
    REASON_APPLY_FAILED = 12;
    // The commit's own words were wrong (`confirmed` outside 1-60 minutes).
    REASON_USAGE = 13;
    // A refusal none of the above names; read the message.
    REASON_OTHER = 14;
    // A reboot or shutdown asked while the running configuration differs
    // from what the next boot loads (#558, phase 5): `save` first, or ask
    // again with `force` (SystemService).
    REASON_UNSAVED = 15;
    // A system action already running on the box: an upgrade or a dataplane
    // restart started earlier and not finished.
    REASON_BUSY = 16;
  }
  Reason reason = 3;
  // REASON_STALE_BASE: the running revision the configuration moved to, the
  // one GetRunning answers now.
  string running_revision = 4;
  // REASON_LIMIT: the field ("cgnat identity file", "description"), its
  // limit and the size refused, in bytes.
  string limit_field = 5;
  uint32 limit = 6;
  uint32 limit_size = 7;
  // REASON_GATE_*: the subscribers, pools or prefixes the gate is about, as
  // CheckResponse lists them.
  repeated string gate_items = 8;
}

// A candidate configuration, as OpenCandidate returned it.
message CandidateRef {
  string candidate_id = 1;
}

// A configuration as the VTY's text.
message ConfigText {
  string text = 1;
  // The running revision this text was read at (see ListRevisions); empty for
  // a candidate.
  string revision = 2;
}

// ---------------------------------------------------------------- config

service ConfigService {
  // Opens a candidate for this call's account: a copy of the running
  // configuration, or of a committed revision when `from_revision` is set.
  rpc OpenCandidate(OpenCandidateRequest) returns (OpenCandidateResponse);
  // Applies lines to a candidate, at a hierarchy path, exactly as typed at
  // the prompt. A line the VTY refuses stages nothing and answers
  // INVALID_ARGUMENT with the refusal; the lines before it are kept.
  rpc Edit(EditRequest) returns (EditResponse);
  // The candidate's text, as `show running-config` would print it once
  // committed.
  rpc ShowCandidate(CandidateRef) returns (ConfigText);
  // The difference between the candidate and the running configuration,
  // as `show configuration compare` prints it.
  rpc Compare(CandidateRef) returns (CompareResponse);
  // `commit check`: everything the box would refuse or warn about, applied
  // nowhere.
  rpc Check(CandidateRef) returns (CheckResponse);
  // `commit`, with its options. Refused with FAILED_PRECONDITION when the
  // check refuses, or when the running configuration has changed since the
  // candidate was opened - the client opens a new candidate and re-applies.
  rpc Commit(CommitRequest) returns (CommitResponse);
  // Confirms a `commit confirmed` window, so the box does not roll back.
  rpc Confirm(ConfirmRequest) returns (ConfirmResponse);
  // Loads committed revision `n` into the candidate (`rollback <n>`); it is
  // applied by a Commit, as at the prompt.
  rpc Rollback(RollbackRequest) returns (EditResponse);
  // `save`: writes the running configuration to the file the boot loads.
  rpc Save(SaveRequest) returns (SaveResponse);
  // Discards a candidate.
  rpc CloseCandidate(CandidateRef) returns (CloseResponse);
  // The running configuration, as `show running-config` prints it.
  rpc GetRunning(GetRunningRequest) returns (ConfigText);
  // The committed revisions `rollback` can load, newest first.
  rpc ListRevisions(ListRevisionsRequest) returns (ListRevisionsResponse);
  // The `commit confirmed` window the box holds, if any (#558), read from the
  // box's own state - it is the same after the API server or a client
  // restarts, and for any account.
  rpc GetPendingConfirm(GetPendingConfirmRequest) returns (PendingConfirm);
  // This account's open candidates, with when each expires (#558).
  rpc ListCandidates(ListCandidatesRequest) returns (ListCandidatesResponse);

  // Typed configuration (#558, phase 2): interfaces, CGNAT pools and the
  // CGNAT log export as fields, read off the same parsed configuration the
  // VTY holds - the running one, or a candidate's.
  rpc GetConfig(GetConfigRequest) returns (TypedConfig);
  // Sets one object of a candidate to the fields given: the server writes
  // the VTY lines that take it there (returned in `lines`) and stages them
  // exactly as Edit would, so every refusal, gate and Diagnostics.reason of
  // the line form applies. `fields` limits the change to the fields named.
  rpc SetConfig(SetConfigRequest) returns (SetConfigResponse);
  // Removes one object from a candidate, as `no interface`, `no pool` or
  // `logging <transport> disable` does.
  rpc DeleteConfig(DeleteConfigRequest) returns (SetConfigResponse);
  // The whole configuration grammar as the prompt's `?` answers it: every
  // mode, how it is entered, each statement's forms, each argument's kind,
  // range, choices and value source, and its `no` - generated from the
  // VTY's own tree, so it cannot differ from the prompt. Versioned by
  // `release` and `digest`.
  rpc GetSchema(GetSchemaRequest) returns (ConfigSchema);
  // Each line, at a hierarchy path, checked by the VTY in a throwaway
  // candidate: accepted or refused with its Diagnostics.reason. Nothing is
  // staged anywhere a client can see.
  rpc ValidateLines(ValidateLinesRequest) returns (ValidateLinesResponse);
}

message OpenCandidateRequest {
  // When set, the candidate starts as committed revision `from_revision`
  // (0 is the newest) rather than as the running configuration.
  optional uint32 from_revision = 1;
}

message OpenCandidateResponse {
  string candidate_id = 1;
  // The running revision the candidate was opened on. A Commit refuses a
  // candidate whose base the running configuration has moved past.
  string base_revision = 2;
  // The candidate's text as opened.
  string text = 3;
  // When the server closes it if nobody uses it (#558): every call naming
  // the candidate moves this to now + idle_seconds.
  google.protobuf.Timestamp expires_at = 4;
  uint32 idle_seconds = 5;
}

message EditRequest {
  string candidate_id = 1;
  // Where the lines apply, outermost first, as the prompt enters it:
  // ["nat", "cgnat", "pool RFC6598"]. Empty is the top of the configuration.
  repeated string path = 2;
  // The lines, each exactly as typed at that level ("block-size 256",
  // "no shutdown", "neighbor 192.0.2.1 remote-as 65000").
  repeated string lines = 3;
}

message EditResponse {
  // Notes and warnings the VTY printed for the accepted lines.
  repeated Diagnostic diagnostics = 1;
  string output = 2;
  // The candidate's activity after this call, and when it now expires
  // (#558).
  google.protobuf.Timestamp last_activity = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message CompareResponse {
  // `show configuration compare`'s text; empty when nothing differs.
  string diff = 1;
  bool changed = 2;
}

message CheckResponse {
  // True when a commit of this candidate would be applied.
  bool passed = 1;
  repeated Diagnostic diagnostics = 2;
  // Subscribers a change would move to other public addresses or blocks
  // (the VTY's `remap` gate): a Commit needs `acknowledge_remap`.
  repeated string remap = 3;
  // The prefix carrying this session the change would stop advertising
  // (`cutoff`): a Commit needs `acknowledge_cutoff`.
  repeated string cutoff = 4;
  // Pools the change would map differently from the HA peer (`diverge`):
  // a Commit needs `acknowledge_diverge`.
  repeated string diverge = 5;
  string output = 6;
  // When `passed` is false: what a Commit would be refused for, the code
  // Diagnostics.reason would carry (#558).
  Diagnostics.Reason reason = 7;
}

message CommitRequest {
  string candidate_id = 1;
  // `commit comment <text>`.
  string comment = 2;
  // `commit confirmed <minutes>`: the box rolls the change back unless a
  // Confirm arrives within this many minutes. 0 is a plain commit.
  uint32 confirmed_minutes = 3;
  // The VTY's gated words, said in as many words.
  bool acknowledge_remap = 4;
  bool acknowledge_cutoff = 5;
  bool acknowledge_diverge = 6;
}

message CommitResponse {
  // The running revision after the commit.
  string revision = 1;
  // When `confirmed_minutes` was set: the moment the box rolls back.
  google.protobuf.Timestamp confirm_deadline = 2;
  repeated Diagnostic diagnostics = 3;
  string output = 4;
}

message ConfirmRequest {}

message ConfirmResponse {
  repeated Diagnostic diagnostics = 1;
  string output = 2;
}

message RollbackRequest {
  string candidate_id = 1;
  // 0 is the newest committed revision.
  uint32 revision = 2;
}

message SaveRequest {}

message SaveResponse {
  string output = 1;
}

message CloseResponse {}

message GetRunningRequest {}

message ListRevisionsRequest {}

message Revision {
  uint32 number = 1;
  google.protobuf.Timestamp committed_at = 2;
  // The comment or the reason the VTY recorded ("loaded from file").
  string comment = 3;
}

message ListRevisionsResponse {
  repeated Revision revisions = 1;
}

message GetPendingConfirmRequest {}

// A `commit confirmed` window (#558).
message PendingConfirm {
  // False: no window; nothing below is set.
  bool pending = 1;
  // The running revision the box rolls back FROM - GetRunning's revision
  // while the window is open.
  string revision = 2;
  // When the box rolls back unless a Confirm (or any commit) arrives.
  google.protobuf.Timestamp deadline = 3;
  // Who committed it, and the commit's comment.
  string account = 4;
  string comment = 5;
  google.protobuf.Timestamp committed_at = 6;
  // The window's length as asked; 0 when this account cannot read the
  // window file (a read-only role), which does not change `deadline`.
  uint32 minutes = 7;
  // Reverts the box has tried and failed; non-zero is a box still on the
  // unconfirmed configuration past its deadline.
  uint32 revert_attempts = 8;
  // The deadline has passed and the window is still there.
  bool overdue = 9;
}

message ListCandidatesRequest {}

message CandidateInfo {
  string candidate_id = 1;
  // The running revision it was opened on.
  string base_revision = 2;
  google.protobuf.Timestamp created_at = 3;
  // The last call that named it; listing does not count.
  google.protobuf.Timestamp last_activity = 4;
  // last_activity + idle_seconds: the server closes it then.
  google.protobuf.Timestamp expires_at = 5;
  // Lines it adds or removes against its base, as `show configuration
  // compare` counts them.
  uint32 staged_lines = 6;
}

message ListCandidatesResponse {
  // Oldest first; only the calling account's.
  repeated CandidateInfo candidates = 1;
  // The server's idle rule: a candidate unused this long is closed.
  uint32 idle_seconds = 2;
}

// ---------------------------------------------------- typed configuration

message GetConfigRequest {
  // Empty reads the running configuration; set, that candidate's.
  string candidate_id = 1;
  // "interfaces", "pools", "logging", and the routing half (#558 phase 3):
  // "static", "bgp", "ospf", "ospf6", "isis", "interface_routing". Empty is
  // every area.
  repeated string areas = 2;
}

// An interface as its `interface <name>` block states it. A field at its
// default is a statement the block does not have.
message InterfaceConfig {
  string name = 1;
  // "port", "loopback", "bundle" or "subinterface" (read only).
  string kind = 2;
  string description = 3;
  // 0: no `mtu` statement, the box's default.
  uint32 mtu = 4;
  bool shutdown = 5;
  // "a.b.c.d/m", in the order written.
  repeated string ipv4 = 6;
  repeated string ipv6 = 7;
  // "", "inside" or "outside": `cgnat inside|outside`.
  string cgnat_role = 8;
  // 0: the default table, no `vrf` statement.
  uint32 vrf = 9;
  // "": the interface's own name (the pair is made under it).
  string linux_name = 10;
  // A sub-interface's tags (0: none); set only when creating one.
  uint32 vlan_outer = 11;
  uint32 vlan_inner = 12;
  string mac_address = 13;
  // "", "strict" or "loose".
  string urpf = 14;
  // `no ipv6 nd suppress-ra`: router advertisements are sent.
  bool router_advertisements = 15;
  // `ipv6 nd nat64 <prefix>`: the NAT64 prefixes the advertisements carry
  // as PREF64 (RFC 8781), RFC 5952 form, sorted. Each must be a NAT64
  // pool's nat64-prefix, and router_advertisements must be true.
  repeated string pref64 = 16;
}

message PortForwardConfig {
  // "tcp" or "udp".
  string protocol = 1;
  uint32 public_port = 2;
  // An IPv4 address, or on a NAT64 pool an IPv6 host of one of its
  // subscribers' prefixes (#485).
  string private_address = 3;
  uint32 private_port = 4;
}

// A CGNAT pool as its `pool <name>` block states it.
message PoolConfig {
  string name = 1;
  repeated string prefix_inside = 2;
  repeated string prefix_outside = 3;
  uint32 block_size = 4;
  // Both 0: the device's own port range (no `ports` statement).
  uint32 port_first = 5;
  uint32 port_last = 6;
  // "interleaved" or "blocked".
  string policy = 7;
  // "deterministic" or "dynamic".
  string mode = 8;
  // Unset: every VRF (no statement), which is not VRF 0.
  optional uint32 vrf = 9;
  optional uint32 outside_vrf = 10;
  // Overrides only, seconds, by name ("udp", "icmp", "tcp-syn", "gre",
  // "tcp-transitory", "tcp-established", "port-holddown", "alg-expect").
  map<string, uint32> timeouts = 11;
  // 1: one block per subscriber, the default.
  uint32 max_blocks = 12;
  // Ports; 0: one block.
  uint32 initial_allocation = 13;
  uint32 block_stride = 14;
  uint32 reserve = 15;
  repeated string bypass_source = 16;
  repeated string bypass_destination = 17;
  // Percent; 0: off.
  uint32 utilisation_alarm = 18;
  // 0: unlimited.
  uint32 max_sessions = 19;
  uint32 max_session_rate = 20;
  // "": off; "auto"; or a number of bytes.
  string tcp_mss = 21;
  // "endpoint-independent" or "address-dependent".
  string filter = 22;
  // Only the ALGs the operator chose ("ftp", "rtsp", "pptp", "esp", "sip").
  map<string, bool> algs = 23;
  repeated PortForwardConfig forwards = 24;
  // BREAKING (#572, 2026-10-05): a NAT64 pool is no longer a PoolConfig. It
  // is written under `nat` > `nat64` and read and set as Nat64PoolConfig, in
  // TypedConfig.nat64_pools and SetConfigRequest.nat64_pool. The two numbers
  // it held are never reused.
  reserved 25, 26;
  reserved "subscriber_length", "nat64_prefix";
}

// A NAT64 pool as its `pool <name>` block under `nat` > `nat64` states it
// (#572). The fields a CGNAT pool has, with the numbers it has them under,
// less the bypass a NAT64 pool never takes (#485); plus the two that make it
// NAT64. prefix_inside is IPv6; prefix_outside is IPv4.
message Nat64PoolConfig {
  string name = 1;
  repeated string prefix_inside = 2;
  repeated string prefix_outside = 3;
  uint32 block_size = 4;
  // The public port range; 0 and 0: the device default.
  uint32 port_first = 5;
  uint32 port_last = 6;
  string policy = 7;
  // "deterministic" or "dynamic".
  string mode = 8;
  optional uint32 vrf = 9;
  optional uint32 outside_vrf = 10;
  map<string, uint32> timeouts = 11;
  uint32 max_blocks = 12;
  uint32 initial_allocation = 13;
  uint32 block_stride = 14;
  uint32 reserve = 15;
  // A NAT64 pool takes no bypass (#485): an IPv6 packet to the NAT64 prefix
  // reaches IPv4 only translated.
  reserved 16, 17;
  reserved "bypass_source", "bypass_destination";
  uint32 utilisation_alarm = 18;
  uint32 max_sessions = 19;
  uint32 max_session_rate = 20;
  string tcp_mss = 21;
  string filter = 22;
  // Only "ftp" can be on (FTP64, RFC 6384); "rtsp", "sip", "pptp" and "esp"
  // are refused on a NAT64 pool for good.
  map<string, bool> algs = 23;
  // private_address is an IPv6 host of one of the subscribers' prefixes.
  repeated PortForwardConfig forwards = 24;
  // The prefix length one subscriber holds (the delegated prefix).
  uint32 subscriber_length = 25;
  // RFC 6052's prefix; "": the well-known 64:ff9b::/96 (no statement).
  string nat64_prefix = 26;
}

// One CGNAT log stream's collector, as `logging <transport> ...` states it.
message LogCollectorConfig {
  // "udp" (IPFIX), "tcp" (IPFIX over TCP) or "syslog" (RFC 5424 over TCP).
  string transport = 1;
  // false: no collector (`logging <transport> disable`, or never set).
  bool configured = 2;
  string collector = 3;
  // 0: the transport's default port.
  uint32 port = 4;
  // udp only: the source address the export leaves from (`src`).
  string source = 5;
  // syslog only: the structured-data enterprise number.
  uint32 enterprise = 6;
  // syslog only; unset: the box's defaults.
  optional uint32 facility = 7;
  optional uint32 severity = 8;
}

message LoggingConfig {
  // `logging enable`: UDP export on.
  bool enabled = 1;
  // Always the three, udp, tcp, syslog, in that order, on a read.
  repeated LogCollectorConfig collectors = 2;
}

message TypedConfig {
  // "running" or "candidate".
  string source = 1;
  // The running revision read (empty for a candidate).
  string revision = 2;
  string candidate_id = 3;
  repeated InterfaceConfig interfaces = 4;
  // The CGNAT pools, under `nat` > `cgnat` (since #572, IPv4 inside only).
  repeated PoolConfig pools = 5;
  LoggingConfig logging = 6;
  // Lines of this configuration that are the BOX's, not the operator's
  // (FRR's own logging, the box's own VRF): no grammar takes them and the
  // VTY marks them "not checked". Show them read only, on purpose - every
  // read answers them, whatever the areas.
  repeated BoxOwnedLine box_owned = 7;
  // The routing half (#558, phase 3), read off the FRR statements the
  // configuration holds - the ones `show running-config` prints - block by
  // block. A statement no field takes is kept verbatim in its block's
  // `other`: nothing is dropped.
  repeated StaticRouteConfig static_routes = 8;
  repeated BgpConfig bgp = 9;
  repeated OspfConfig ospf = 10;
  repeated OspfConfig ospf6 = 11;
  repeated IsisConfig isis = 12;
  repeated InterfaceRoutingConfig interface_routing = 13;
  // The rest of the configuration (#558, phase 4). SECRETS ARE NEVER READ:
  // a password is `password_set`, an SNMP community is counted, an SNMP
  // user's passphrases are their protocol only, a key is counted.
  SystemConfig system = 14;
  repeated UserConfig users = 15;
  repeated SnmpUserConfig snmp_users = 16;
  // The NAT64 pools, under `nat` > `nat64` (#572): GetConfig area "nat64".
  repeated Nat64PoolConfig nat64_pools = 30;
  // policy-options (#458), as policy.py parses it for the commit.
  PolicyConfig policy = 17;
  // The route-maps an operator wrote in the routing half; the compiled
  // `PO-` maps are policy-options' and are in `policy`.
  repeated RouteMapConfig route_maps = 18;
  // FRR's prefix-lists, community/large-community lists and AS-path
  // access-lists, written in the routing half.
  FrrListsConfig frr_lists = 19;
  RpkiConfig rpki = 20;
  // `ip|ipv6 protocol <p> route-map <m>` and `fib-policy <p> <policy>`;
  // any other top-level routing statement verbatim in `other`.
  RoutingAttachmentsConfig routing_attachments = 21;
  repeated VrfDeviceConfig vrfs = 22;
  repeated VrrpConfig vrrp = 23;
  repeated BundleConfig bundles = 24;
  // `nat` > `cgnat` statements other than pools, roles and the log export.
  CgnatGlobalsConfig cgnat_globals = 25;
  // The `bfd` block (#559 phase 3): its sessions and its timer profiles,
  // area "bfd". A BGP neighbour's and a static route's BFD are on those.
  repeated BfdPeerConfig bfd_peers = 26;
  repeated BfdProfileConfig bfd_profiles = 27;
}


// The timers a BFD session and a profile both take (#559 phase 3). Every
// field at 0 / false is a statement the block does not have, and FRR's own
// default applies: detect-multiplier 3, the intervals 300 ms, the echo
// intervals 50 ms, minimum-ttl 254 (multihop only).
message BfdTimers {
  // Packets missed before the session goes down, 2-255.
  uint32 detect_multiplier = 1;
  // The slowest this box wants to receive / the fastest it sends, in ms
  // (10-4294967).
  uint32 receive_interval_ms = 2;
  uint32 transmit_interval_ms = 3;
  // Multihop only: the lowest TTL accepted, 1-254.
  uint32 minimum_ttl = 4;
  bool echo_mode = 5;
  bool passive_mode = 6;
  // The session held down, its configuration kept.
  bool shutdown = 7;
  // `echo receive-interval`: in ms, or disabled (then the ms is 0).
  uint32 echo_receive_interval_ms = 8;
  bool echo_receive_disabled = 9;
  uint32 echo_transmit_interval_ms = 10;
}

// A `peer` of the `bfd` block. The session IS its key - address, multihop,
// local_address, interface, vrf - as FRR keys it: SetConfig finds the
// session by those five whatever order a client gives them in, and changing
// one of them is another session.
message BfdPeerConfig {
  string address = 1;
  bool multihop = 2;
  string local_address = 3;
  string interface = 4;
  string vrf = 5;
  // The profile whose timers it takes; a timer set here wins.
  string profile = 6;
  BfdTimers timers = 7;
  // Statements of its body no field takes, verbatim (read only).
  repeated string other = 8;
  // The `peer ...` line as the configuration holds it (read only).
  string header = 9;
}

// A `profile <name>` of the `bfd` block.
message BfdProfileConfig {
  string name = 1;
  BfdTimers timers = 2;
  repeated string other = 3;
}

message CgnatGlobalsConfig {
  // Seconds, by "udp", "icmp", "tcp-transitory", "tcp-established"; a kind
  // not listed is at its default.
  repeated KeyValue timeouts = 1;
  // Seconds; 0 is the default.
  uint32 block_holddown = 2;
  // "file", "dhcp-leases", "radius", "none", or "" when not stated (#21).
  string identity_source = 3;
  string identity_path = 4;
  uint32 identity_radius_port = 5;
  // The RADIUS secret itself is never read.
  bool identity_radius_secret_set = 6;
  // 0: not stated (sized by the box).
  uint32 session_table_buckets = 7;
  uint32 session_table_memory_mb = 8;
  // `memory <GB>`, from the next boot; 0 is sized by the tuner.
  uint32 memory_gb = 9;
  repeated string other = 10;
}

// A setting held as a pair: system > cpu / memory.
message KeyValue {
  string key = 1;
  string value = 2;
}

message SshConfig {
  uint32 port = 1;
  string listen_address = 2;
  // "yes", "no", "prohibit-password" or "forced-commands-only".
  string permit_root_login = 3;
  bool password_authentication = 4;
}

message ApiConfig {
  bool enabled = 1;
  // Empty: the management address (no listener is configured).
  string listen_address = 2;
  uint32 port = 3;
}

message SnmpTrapHost {
  string address = 1;
  // An inform (acknowledged), else a trap. The community is never read.
  bool inform = 2;
}

message SnmpAgentConfig {
  bool enabled = 1;
  string listen_address = 2;
  uint32 port = 3;
  // The root PRISMA-ROUTING-MIB is served under (67033 when not named).
  uint32 enterprise_number = 4;
  // How many SNMPv2c communities are configured; their strings are secrets.
  uint32 communities = 5;
  repeated SnmpTrapHost trap_hosts = 6;
}

message SystemConfig {
  // "" when no statement names it (the installer's default).
  string hostname = 1;
  repeated string dns_servers = 2;
  SshConfig ssh = 3;
  ApiConfig api = 4;
  SnmpAgentConfig snmp = 5;
  // The card the dataplane is given (system > dataplane > interface).
  string dataplane_interface = 6;
  // 0: sized from the subscriber target by the tuner.
  uint32 cgnat_memory_gb = 7;
  // system > cpu and system > memory, statement by statement; they take
  // effect at the next boot.
  repeated KeyValue cpu = 8;
  repeated KeyValue memory = 9;
}

message UserConfig {
  string name = 1;
  // "administrator", "cgnat-operator", or "" for read only.
  string role = 2;
  // How many SSH public keys the account has.
  uint32 ssh_keys = 3;
  bool password_set = 4;
  // The system actions beside the role (#563): `operator` in the user block,
  // membership of prisma-operator on the box.
  bool operator = 5;
}

message SnmpUserConfig {
  string name = 1;
  // "sha", "md5"...; "" for none. The passphrases are never read.
  string auth_protocol = 2;
  // "aes", "des"...; "" for none.
  string priv_protocol = 3;
}

message NamedList {
  string name = 1;
  repeated string members = 2;
}

message AsPathRegex {
  string name = 1;
  string regex = 2;
}

// One condition of a term: every value of a kind ORed, kinds ANDed.
message PolicyMatchConfig {
  // The VTY's word after `from`: "prefix-list", "community", "as-path",
  // "protocol", "route-filter", "neighbor", "family", "policy"...
  string kind = 1;
  repeated string values = 2;
}

message PolicySetConfig {
  // The VTY's word after `set`: "local-preference", "community", "metric"...
  string what = 1;
  repeated string args = 2;
}

message PolicyTermConfig {
  string name = 1;
  repeated PolicyMatchConfig from = 2;
  repeated PolicySetConfig sets = 3;
  // "accept", "reject", "next term", "next policy", or "" for none.
  string then = 4;
}

message PolicyStatementConfig {
  string name = 1;
  // What a route no term decided gets: "accept", "reject", or "".
  string default_action = 2;
  repeated PolicyTermConfig terms = 3;
}

message PolicyUnreadLine {
  string line = 1;
  string why = 2;
}

message PolicyConfig {
  repeated NamedList prefix_lists = 1;
  repeated NamedList communities = 2;
  repeated NamedList large_communities = 3;
  // Members as "rt:<asn>:<value>" / "soo:<asn>:<value>".
  repeated NamedList extended_communities = 4;
  repeated AsPathRegex as_paths = 5;
  repeated PolicyStatementConfig statements = 6;
  // A policy-options line the parser could not read, verbatim, with why.
  repeated PolicyUnreadLine unread = 7;
}

message RouteMapEntry {
  // "permit" or "deny".
  string action = 1;
  uint32 sequence = 2;
  // FRR's words after `match` / `set`, one statement each.
  repeated string matches = 3;
  repeated string sets = 4;
  string call = 5;
  // "next", "goto <n>", or "".
  string on_match = 6;
  string description = 7;
  repeated string other = 8;
}

message RouteMapConfig {
  string name = 1;
  repeated RouteMapEntry entries = 2;
}

message PrefixListEntry {
  // 0: not stated (FRR numbers it).
  uint32 sequence = 1;
  string action = 2;
  string prefix = 3;
  // 0: not stated.
  uint32 ge = 4;
  uint32 le = 5;
}

message FrrPrefixList {
  // "ipv4" or "ipv6".
  string family = 1;
  string name = 2;
  repeated PrefixListEntry entries = 3;
}

message BgpListEntry {
  uint32 sequence = 1;
  string action = 2;
  // The community, large community or regular expression, as written.
  string value = 3;
}

message BgpList {
  // "community", "large-community", "extcommunity" or "as-path".
  string kind = 1;
  // "standard", "expanded", or "" (an AS-path list has none).
  string style = 2;
  string name = 3;
  repeated BgpListEntry entries = 4;
}

message FrrListsConfig {
  repeated FrrPrefixList prefix_lists = 1;
  repeated BgpList bgp_lists = 2;
}

message RpkiCache {
  // "tcp" or "ssh".
  string transport = 1;
  string host = 2;
  uint32 port = 3;
  // ssh only; the key files are never read.
  string user = 4;
  string source = 5;
  uint32 preference = 6;
}

message RpkiConfig {
  repeated RpkiCache caches = 1;
  // 0: not stated (FRR's default).
  uint32 polling_period = 2;
  uint32 expire_interval = 3;
  uint32 retry_interval = 4;
  repeated string other = 5;
}

message RoutingAttachment {
  // "protocol-route-map" or "fib-policy".
  string kind = 1;
  // "ipv4" / "ipv6" for a protocol route-map; "" for a fib-policy.
  string family = 2;
  string protocol = 3;
  // The route-map or the policy-statement.
  string name = 4;
}

message RoutingAttachmentsConfig {
  repeated RoutingAttachment attachments = 1;
  repeated string other = 2;
}

message VrfDeviceConfig {
  string name = 1;
  uint32 table = 2;
}

message VrrpTrack {
  string interface = 1;
  uint32 decrement = 2;
}

message VrrpConfig {
  string interface = 1;
  uint32 vrid = 2;
  repeated string addresses = 3;
  uint32 priority = 4;
  repeated VrrpTrack track = 5;
}

message BundleConfig {
  string name = 1;
  repeated string members = 2;
  // "active" or "passive".
  string lacp = 3;
  // "fast" or "slow".
  string rate = 4;
  // "l2", "l23" or "l34".
  string hash = 5;
}

// A static route. Top level is `router static` on the VTY's screens, with
// the description this box keeps for it; `vrf` set is a VRF's own route.
message StaticRouteConfig {
  string prefix = 1;
  // An address, an interface, or blackhole / Null0 / reject.
  string next_hop = 2;
  // 0: not stated (FRR's default distance applies).
  uint32 distance = 3;
  // 0: no tag.
  uint32 tag = 4;
  string description = 5;
  string vrf = 6;
  // "ipv4" or "ipv6".
  string family = 7;
  // FRR's own words after the next hop (an interface, onlink), as typed.
  repeated string extra = 8;
  // The route as `router static` takes it (read only).
  string line = 9;
  // The route tracked by a BFD session (#559 phase 3): `bfd [multi-hop]
  // [source <address>] [profile <name>]`. Before phase 3 these words were
  // in `extra`. The options need `bfd`.
  bool bfd = 10;
  bool bfd_multihop = 11;
  string bfd_source = 12;
  string bfd_profile = 13;
}

// A redistribution into a routing protocol.
message RedistributeConfig {
  // "connected", "static", "ospf"...; IS-IS: "ipv4 connected".
  string protocol = 1;
  string route_map = 2;
  // 0: not stated.
  uint32 metric = 3;
  string metric_type = 4;
  // IS-IS: "level-1" / "level-2".
  string level = 5;
  // The statement, verbatim.
  string statement = 6;
}

// A `router bgp` block.
message BgpConfig {
  // The AS number as written (65000, or asdot 1.10).
  string asn = 1;
  // "" is the default VRF.
  string vrf = 2;
  string router_id = 3;
  repeated BgpNeighborConfig neighbors = 4;
  repeated BgpFamilyConfig families = 5;
  // Router-level statements no field above takes, verbatim.
  repeated string other = 6;
  // `bgp default ipv4-unicast`: FRR's default is on, and with it a
  // neighbour is active in ipv4 unicast with NO `activate` line - FRR does
  // not print one back. False only when `no bgp default ipv4-unicast` is
  // stated. A family's `activate` is what is stated; read it with this.
  bool default_ipv4_unicast = 7;
  // The block's knobs phase 3 kept in `other`, as key (the statement's
  // keywords) and value ("" for a flag; a password is "<set>"), #558
  // phase 4. What no key takes is still in `other`.
  repeated KeyValue settings = 8;
}

// A neighbour (or peer-group) at the router level.
message BgpNeighborConfig {
  // An address, an interface (unnumbered) or a peer-group name.
  string address = 1;
  // A number, or "internal"/"external"; "" when a peer-group gives it.
  string remote_as = 2;
  string description = 3;
  string update_source = 4;
  // 0 / 0: the defaults.
  uint32 keepalive = 5;
  uint32 holdtime = 6;
  // Whether a password is set. Its value is a secret and is never read.
  bool password_set = 7;
  // The peer-group this neighbour belongs to.
  string peer_group = 8;
  // This entry IS a peer-group.
  bool is_peer_group = 9;
  // 0: not stated.
  uint32 ebgp_multihop = 10;
  bool shutdown = 11;
  bool bfd = 12;
  repeated string other = 13;
  // The block's knobs phase 3 kept in `other`, as key (the statement's
  // keywords) and value ("" for a flag; a password is "<set>"), #558
  // phase 4. What no key takes is still in `other`.
  repeated KeyValue settings = 14;
  // `neighbor X bfd profile <name>` (#559 phase 3); needs `bfd`. Before
  // phase 3 a profile was read as `bfd` alone and dropped.
  string bfd_profile = 15;
}

// An `address-family` of a `router bgp` block.
message BgpFamilyConfig {
  // "ipv4" / "ipv6" / "l2vpn"...
  string afi = 1;
  // "unicast" / "multicast" / "evpn"...
  string safi = 2;
  repeated string networks = 3;
  repeated BgpAggregateConfig aggregates = 4;
  repeated RedistributeConfig redistribute = 5;
  repeated BgpNeighborFamilyConfig neighbors = 6;
  repeated string other = 7;
  // The block's knobs phase 3 kept in `other`, as key (the statement's
  // keywords) and value ("" for a flag; a password is "<set>"), #558
  // phase 4. What no key takes is still in `other`.
  repeated KeyValue settings = 8;
}

message BgpAggregateConfig {
  string prefix = 1;
  bool summary_only = 2;
  bool as_set = 3;
}

// What a family says about one neighbour.
message BgpNeighborFamilyConfig {
  string neighbor = 1;
  bool activate = 2;
  // Route-maps named PO-... are the routing policy's compiled maps (#458).
  string route_map_in = 3;
  string route_map_out = 4;
  string prefix_list_in = 5;
  string prefix_list_out = 6;
  // 0: no limit stated.
  uint32 maximum_prefix = 7;
  bool next_hop_self = 8;
  bool soft_reconfiguration_inbound = 9;
  bool default_originate = 10;
  repeated string other = 11;
  // The block's knobs phase 3 kept in `other`, as key (the statement's
  // keywords) and value ("" for a flag; a password is "<set>"), #558
  // phase 4. What no key takes is still in `other`.
  repeated KeyValue settings = 12;
}

// A `router ospf` (version 2) or `router ospf6` (version 3) block.
message OspfConfig {
  uint32 version = 1;
  string vrf = 2;
  string router_id = 3;
  repeated OspfNetworkConfig networks = 4;
  repeated OspfAreaConfig areas = 5;
  // `passive-interface default`.
  bool passive_default = 6;
  repeated string passive = 7;
  // `no passive-interface <name>`: taken back out of the default.
  repeated string not_passive = 8;
  repeated RedistributeConfig redistribute = 9;
  // The `default-information` statement verbatim; "" when absent.
  string default_information = 10;
  repeated string other = 11;
  // The block's knobs phase 3 kept in `other`, as key (the statement's
  // keywords) and value ("" for a flag; a password is "<set>"), #558
  // phase 4. What no key takes is still in `other`.
  repeated KeyValue settings = 12;
}

message OspfNetworkConfig {
  string prefix = 1;
  string area = 2;
}

message OspfAreaConfig {
  string area = 1;
  // "normal", "stub" or "nssa".
  string area_type = 2;
  bool no_summary = 3;
  // The area's other statements (ranges, authentication), verbatim.
  repeated string other = 4;
}

// A `router isis <tag>` block.
message IsisConfig {
  string tag = 1;
  string vrf = 2;
  repeated string nets = 3;
  // "level-1", "level-2-only", "level-1-2"; "" when not stated.
  string is_type = 4;
  string metric_style = 5;
  repeated RedistributeConfig redistribute = 6;
  repeated string other = 7;
  // The block's knobs phase 3 kept in `other`, as key (the statement's
  // keywords) and value ("" for a flag; a password is "<set>"), #558
  // phase 4. What no key takes is still in `other`.
  repeated KeyValue settings = 8;
}

// What an interface's FRR block says to the IGPs.
message InterfaceRoutingConfig {
  string name = 1;
  string ospf_area = 2;
  uint32 ospf_cost = 3;
  bool ospf_passive = 4;
  // "broadcast", "point-to-point"...; "" when not stated.
  string ospf_network = 5;
  uint32 ospf_hello = 6;
  uint32 ospf_dead = 7;
  string ospf6_area = 8;
  uint32 ospf6_cost = 9;
  bool ospf6_passive = 10;
  // The IS-IS instances the interface is in (`ip/ipv6 router isis <tag>`).
  repeated string isis_instances = 11;
  string isis_circuit_type = 12;
  uint32 isis_metric = 13;
  bool isis_passive = 14;
  repeated string other = 15;
}

// A BGP neighbour to set (#558 phase 3): its router-level fields and, per
// family, what the family says about it.
message BgpNeighborEdit {
  // The `router bgp` it is in: asn, and vrf ("" the default).
  string asn = 1;
  string vrf = 2;
  BgpNeighborConfig neighbor = 3;
  // Write only: set to change the password; read back as password_set.
  string password = 4;
  repeated BgpNeighborFamilyEdit families = 5;
}

message BgpNeighborFamilyEdit {
  string afi = 1;
  string safi = 2;
  BgpNeighborFamilyConfig settings = 3;
}

message BoxOwnedLine {
  string line = 1;
  // Why it is the box's.
  string why = 2;
}

message SetConfigRequest {
  string candidate_id = 1;
  oneof object {
    InterfaceConfig interface = 2;
    // A CGNAT pool. A NAT64 pool is nat64_pool (#572).
    PoolConfig pool = 3;
    Nat64PoolConfig nat64_pool = 15;
    LoggingConfig logging = 4;
    // #558 phase 3: a top-level static route (`router static`), and a BGP
    // neighbour of a `router bgp` block.
    StaticRouteConfig static_route = 6;
    BgpNeighborEdit bgp_neighbor = 7;
    // #558 phase 4: the system settings (fields named like "ssh.port"),
    // and a Linux VRF device (#540).
    SystemConfig system = 8;
    VrfDeviceConfig vrf_device = 9;
    // #559 phase 3: a BFD session, found by its key fields, and a profile,
    // by its name. Their timers are named in `fields` as "timers" (every
    // one) or "timers.<field>" (that one).
    BfdPeerConfig bfd_peer = 10;
    BfdProfileConfig bfd_profile = 11;
  }
  // The fields to change, by their names in the message above ("mtu",
  // "ipv4", "collectors"; "ports" for port_first/port_last, "vlan" for the
  // tags); empty changes every field to the value given.
  repeated string fields = 5;
}

message SetConfigResponse {
  // Where the lines were staged, and the lines, as Edit would take them.
  repeated string path = 1;
  repeated string lines = 2;
  repeated Diagnostic diagnostics = 3;
  string output = 4;
  google.protobuf.Timestamp last_activity = 5;
  google.protobuf.Timestamp expires_at = 6;
}

message DeleteConfigRequest {
  string candidate_id = 1;
  // "interfaces", "pools", "nat64", "logging", "static", "bgp", "vrfs" or
  // "bfd". "bfd" removes the profile `name`, or the session `bfd_peer` (by
  // its key fields), or - neither given - the whole `bfd` block, body and all.
  string area = 2;
  // The interface, pool or VRF device.
  string name = 3;
  // logging: "udp", "tcp" or "syslog".
  string transport = 4;
  // "static": the route, by prefix and next hop (top level only).
  string prefix = 5;
  string next_hop = 6;
  // "bgp": the neighbour is `name`, in the `router bgp` of asn (and vrf).
  string asn = 7;
  string vrf = 8;
  // "bfd": the session to remove; only its key fields are read.
  BfdPeerConfig bfd_peer = 9;
}

message GetSchemaRequest {
  // The configuration modes to describe, as SchemaMode.mode names them
  // ("pool", "router bgp", "interface (port)"); empty is every mode.
  repeated string modes = 1;
  // Also answer `values`: what each dynamic source holds on this box now.
  // Off by default: it asks the dataplane and FRR.
  bool with_values = 2;
}

message SchemaArgument {
  // As the prompt shows it: "<64-32768>", "src", "<A.B.C.D/M>".
  string name = 1;
  // "integer", "ipv4_prefix", "ipv4_address", "ipv6_prefix",
  // "ipv6_address", "address" (either family), "prefix" (either family),
  // "mac", "choice", "word", "text" (the rest of the line) or "keyword"
  // (the literal word itself).
  string kind = 2;
  // integer: the range, inclusive (0/0 when the grammar states none).
  int64 min = 3;
  int64 max = 4;
  // choice: the values.
  repeated string choices = 5;
  bool optional = 6;
  // Where the VTY completes this argument's values from ("interfaces",
  // "pools", "neighbours", "next_hops", "prefix_lists", "route_maps",
  // "users", ...); empty when it does not. ConfigSchema.values holds them
  // when asked.
  string source = 7;
  // How many of the statement's `words` come before it (#558 phase 4):
  // `neighbor <address> remote-as <asn>` is words ["neighbor", "remote-as"]
  // with <address> at 1 and <asn> at 2. `words` holds literal keywords only;
  // a placeholder is always an argument (in 0.149.22 one could be a word).
  uint32 position = 8;
  // A keyword-led part - the keyword and the values after it that share
  // its optional/required standing - that may come anywhere after the
  // statement's words, in any order among the other unordered parts: FRR
  // prints them in an order of its own (`logging syslog <c> port 1601
  // enterprise 67033 ...`). The other arguments are positional and keep
  // their order (`[seq <n>] permit|deny <prefix>`: `seq <n>` a part, the
  // choice and the prefix positional).
  bool unordered = 9;
  // Which keyword-led part it belongs to (1, 2, ...); 0 is positional.
  uint32 group = 10;
  // It takes one or more values, to the end of the line (the grammar's
  // `<community>...`); `text` takes the rest of the line as one value.
  bool many = 11;
}

// One way to write a statement. A `|` between a placeholder and words in
// the grammar (`<1-4294967295>|internal|external`) is two forms: one with
// the integer, one with the choice - never a choice holding a placeholder.
message SchemaForm {
  repeated SchemaArgument arguments = 1;
}

message SchemaStatement {
  // The statement's words, e.g. ["timeout", "udp"], ["ipv4", "address"].
  repeated string words = 1;
  string help = 2;
  // One per alternative ("<collector> ... | disable" is two).
  repeated SchemaForm forms = 3;
  // Whether a `no` removes it, and the words that start that `no` (a list
  // item takes its value after them: `no ipv4 address <A.B.C.D/M>`).
  bool removable = 4;
  repeated string no_words = 5;
  // The grammar's help says it may repeat (more than one at a time).
  bool repeatable = 6;
  // GetConfig/SetConfig read and write it as a field (#558, phase 2).
  bool typed = 7;
  // GetConfig reads it as a field, whether or not SetConfig writes it
  // (#558 phases 3-4: the routing half, system, accounts, policy).
  bool read_typed = 8;
}

message SchemaMode {
  // The mode's name: "config", "pool", "router bgp", "interface (port)".
  string mode = 1;
  // EditRequest.path to type its statements at; "<name>", "<asn>" and the
  // like are placeholders the client fills.
  repeated string path = 2;
  // How it is entered, as docs/api-coverage.md says it.
  string enter = 3;
  // The roles that may change it.
  string roles = 4;
  repeated SchemaStatement statements = 5;
  // The GetConfig area that reads it ("interfaces", "pools", "logging",
  // "bgp", "system", "policy"...), or empty.
  string typed_area = 6;
}

message ValueList {
  repeated string values = 1;
}

message ConfigSchema {
  repeated SchemaMode modes = 1;
  // The release whose VTY this grammar is, and a hash of the grammar: equal
  // hashes are equal grammars, so a client caches by it.
  string release = 2;
  string digest = 3;
  // with_values: each dynamic source's values on this box now.
  map<string, ValueList> values = 4;
  // The statements a running configuration may hold that no mode's grammar
  // takes because they are the box's own: read only. TypedConfig.box_owned
  // lists the ones a configuration has.
  repeated BoxOwnedStatement box_owned = 5;
}

message BoxOwnedStatement {
  // The statement as a pattern: "log syslog <level>", "vrf prisma-<name>".
  string pattern = 1;
  string why = 2;
}

message ValidateLinesRequest {
  repeated string path = 1;
  repeated string lines = 2;
}

message LineVerdict {
  string line = 1;
  bool ok = 2;
  // When refused: the same code Edit would carry (GRAMMAR, LIMIT, ...).
  Diagnostics.Reason reason = 3;
  // The VTY's words, accepted or refused.
  string message = 4;
}

message ValidateLinesResponse {
  repeated LineVerdict verdicts = 1;
}

// ----------------------------------------------------------- operational

// Typed operational data, read by the same readers the VTY's `show`
// commands use. What is not typed yet is reachable through Show.
service OperationalService {
  rpc GetVersion(GetVersionRequest) returns (VersionInfo);
  rpc GetSystem(GetSystemRequest) returns (SystemInfo);
  rpc ListInterfaces(ListInterfacesRequest) returns (ListInterfacesResponse);
  rpc ListPools(ListPoolsRequest) returns (ListPoolsResponse);
  rpc GetSubscriber(GetSubscriberRequest) returns (Subscriber);
  rpc GetSessionsSummary(GetSessionsSummaryRequest) returns (SessionsSummary);
  rpc ListBgpNeighbors(ListBgpNeighborsRequest) returns (ListBgpNeighborsResponse);
  rpc ListOspfNeighbors(ListOspfNeighborsRequest) returns (ListOspfNeighborsResponse);
  rpc ListIsisAdjacencies(ListIsisAdjacenciesRequest) returns (ListIsisAdjacenciesResponse);
  rpc ListVrrp(ListVrrpRequest) returns (ListVrrpResponse);
  rpc ListBundles(ListBundlesRequest) returns (ListBundlesResponse);
  // Routing policy (#538). Every policy-statement the box runs, with its
  // terms, its text as typed under `policy-options` and where it is
  // applied: `show policy`.
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  // How many routes each term matched, at each place a policy is applied,
  // from FRR's route-map counters: `show policy <name>`.
  rpc GetPolicyCounters(GetPolicyCountersRequest) returns (GetPolicyCountersResponse);
  // What a policy does with a route - described, or read off the box - at
  // a use, simulated as FRR runs the map: `test policy <p> route|rib`.
  rpc TestPolicy(TestPolicyRequest) returns (TestPolicyResponse);
  // Any operational command the VTY takes (`show ...`, `ping ...`), with
  // its text exactly as the VTY prints it. Configuration and shell commands
  // are refused, and so is `monitor`, which redraws a terminal a call has not
  // got - TelemetryService is the API's live view.
  rpc Show(ShowRequest) returns (ShowResponse);
  // The CGNAT log export (#555): each stream - syslog and IPFIX over TCP,
  // IPFIX over UDP - who carries it, its collector, its counters and whether
  // it is delivering, read from the same screen as `show cgnat logging`.
  rpc GetLogging(GetLoggingRequest) returns (LoggingState);
  // A session or a counter reset (#558, phase 5), as the VTY's `clear`:
  // interface counters, a CGNAT subscriber's sessions, a BGP session, OSPF's
  // process or one adjacency, IS-IS adjacencies. Changes no configuration.
  rpc Clear(ClearRequest) returns (ClearResponse);
  // The CGNAT's reads, typed (#558, phase 6). Each is the VTY's screen of
  // the same name read into fields - the same Shell, the same dataplane
  // command, so a typed answer and the screen cannot disagree - and each
  // carries that screen verbatim in `text`. Any account may call them, with
  // the access the VTY gives it: one that cannot reach the dataplane at the
  // prompt is refused here too. A dataplane that does not answer is
  // UNAVAILABLE.
  //
  // `show cgnat translation <public> <port>`: who is behind a public address
  // and port, and whether the answer holds for any instant or only for now -
  // the question a court order or an abuse report asks. INVALID_ARGUMENT for
  // an address or port that is not one; NOT_FOUND, with the dataplane's
  // words, for an address that is no pool's.
  rpc LookupTranslation(LookupTranslationRequest) returns (Translation);
  // `show cgnat top [<n>]`: the subscribers closest to exhausting their
  // blocks, most nearly full first.
  rpc ListTop(ListTopRequest) returns (ListTopResponse);
  // `show cgnat drops`: why packets did not get through, per CGNAT node.
  rpc GetDrops(GetDropsRequest) returns (DropsReport);
  // `show cgnat memory`: the dataplane's main heap, which holds every
  // session, and how many more sessions still fit in it.
  rpc GetCgnatMemory(GetCgnatMemoryRequest) returns (CgnatMemory);
  // `show cgnat blocks`: every pool that allocates blocks, per worker.
  rpc ListBlocks(ListBlocksRequest) returns (ListBlocksResponse);
  // `show cgnat identity`: how many identities the box holds and RADIUS
  // accounting's counters. Never an identity: no screen prints one (#21).
  rpc GetIdentity(GetIdentityRequest) returns (IdentityState);
  // `show cgnat history verify`: the configuration trail's hash chain.
  rpc VerifyHistory(VerifyHistoryRequest) returns (HistoryVerification);
  // `show cgnat alg`: which ALGs the dataplane has on, per pool.
  rpc ListAlgs(ListAlgsRequest) returns (ListAlgsResponse);
  // `show cgnat forward [<pool>]`: the port forwards the dataplane holds.
  rpc ListForwards(ListForwardsRequest) returns (ListForwardsResponse);
  // `show cgnat ha`: whether this box and its peer map subscribers the same
  // way, from the peer's copy at its default path. `peer <file>` - a path
  // on the box's own disk - stays a screen, through Show.
  rpc GetHaStatus(GetHaStatusRequest) returns (HaStatus);

  // #558, phase 7: the rest of the VTY's screens, typed. Same convention as
  // phase 6: each is the VTY's own screen of the same name read into fields
  // by the same Shell, and carries the screen verbatim in `text`. Any
  // account may call them, as any account may type them.
  //
  // `show ospf interface`: what ospfd believes about each interface beside
  // the dataplane's MTU, and the MTU stall that stops an adjacency in
  // Exchange with no log line on either side.
  rpc ListOspfInterfaces(ListOspfInterfacesRequest) returns (OspfInterfaces);
  // `show isis interface`: each IS-IS circuit, and whether the dataplane is
  // punting IS-IS to the kernel - the trap a healthy-looking circuit with
  // no neighbour usually is.
  rpc ListIsisInterfaces(ListIsisInterfacesRequest) returns (IsisInterfaces);
  // `show hardware`: the NICs Linux has, which one carries the default route,
  // and what the dataplane already holds.
  rpc GetHardware(GetHardwareRequest) returns (Hardware);
  // `show logging`: each routing daemon's logging configuration, as FRR
  // reports it.
  rpc GetRoutingLogging(GetRoutingLoggingRequest) returns (RoutingLogging);
  // `show snmp mib` and `show snmp zabbix-template`: the file, with the
  // enterprise number this box serves filled in, to hand to an NMS.
  // FAILED_PRECONDITION when the agent serves no enterprise subtree yet, or
  // the file is not on the box, with the VTY's words.
  rpc GetSnmpFile(GetSnmpFileRequest) returns (SnmpFile);
  // `ping`, `traceroute` and `mtr`, run from the box's management plane as
  // the VTY runs them, streamed: one ProbeEvent per line the tool prints,
  // each read into a reply or a hop where the line is one, and a last one
  // with `end` set. Bounded as at the prompt: `count` is 1-100 (0 is the
  // VTY's default, 5), and the box stops a tool still running after 300 s.
  // INVALID_ARGUMENT, with the VTY's words, for a host, count or source the
  // VTY refuses; FAILED_PRECONDITION when the box has no such tool.
  // Cancelling the call stops the probe. One account's probes run one at a
  // time, as at its console.
  rpc Ping(ProbeRequest) returns (stream ProbeEvent);
  rpc Traceroute(ProbeRequest) returns (stream ProbeEvent);
  rpc Mtr(ProbeRequest) returns (stream ProbeEvent);
  // #559 phase 2: bfdd's sessions, `show bfd peers` as fields - the one
  // reading the screen in `text` is drawn from. `peer` narrows it to the
  // sessions with that neighbour, as `show bfd peer <address>` does;
  // INVALID_ARGUMENT for a peer that is not an address.
  rpc ListBfdSessions(ListBfdSessionsRequest) returns (BfdSessions);
  // Every change of a BFD session's state, streamed: the sessions as they
  // are when the call starts (`initial`), then one event per session whose
  // state changed, appeared or went away, read from bfdd every
  // `interval_seconds` (1-60; 0 is 2). A session going down and back up
  // between two readings is seen as its `session_down_count` moving, which
  // the event carries. Cancelling the call stops it.
  rpc WatchBfd(WatchBfdRequest) returns (stream BfdEvent);
}

// ------------------------------------------------- the CGNAT's reads (#558)

message LookupTranslationRequest {
  // A public address of a pool, IPv4.
  string public_address = 1;
  // 0-65535.
  uint32 port = 2;
}

message Translation {
  enum Source {
    SOURCE_UNSPECIFIED = 0;
    // A deterministic pool's formula: the answer holds for any instant,
    // past or present, while the pool's addresses and block size have not
    // changed since.
    SOURCE_FORMULA = 1;
    // A deterministic pool's reserve block: the holder NOW only.
    SOURCE_RESERVE = 2;
    // A dynamic pool's block: the holder NOW only; for a past instant, the
    // RFC 8158 log says who held it.
    SOURCE_DYNAMIC = 3;
    // The port is outside the pool's usable range: nothing was ever
    // translated there.
    SOURCE_OUTSIDE_RANGE = 4;
  }
  string public_address = 1;
  uint32 port = 2;
  // The subscriber: an IPv4 inside address, or a NAT64 subscriber's
  // delegated prefix ("2001:db8:1200:ab00::/56"). Empty when nobody holds
  // the block now, and for SOURCE_OUTSIDE_RANGE.
  string subscriber = 3;
  string pool = 4;
  // The block's index in the pool, or in its reserve for SOURCE_RESERVE.
  uint32 block = 5;
  Source source = 6;
  // True on a NAT64 pool.
  bool nat64 = 7;
  // True when the answer is about now only (SOURCE_RESERVE, SOURCE_DYNAMIC).
  bool now_only = 8;
  // `show cgnat translation <public> <port>`, verbatim.
  string text = 9;
}

message ListTopRequest {
  // How many rows; 0 is the screen's own default, 10.
  uint32 count = 1;
}

message TopSubscriber {
  // An IPv4 inside address, or a NAT64 subscriber's delegated prefix.
  string subscriber = 1;
  string pool = 2;
  // Gauge: ports in use across all of the subscriber's blocks.
  uint32 ports_used = 3;
  // Gauge: ports in all of its blocks.
  uint32 ports_total = 4;
  // Gauge: ports_used * 100 / ports_total, rounded down.
  uint32 percent_full = 5;
  // Gauge: blocks it holds.
  uint32 blocks = 6;
  // Counter: connections it was refused for want of a port.
  uint32 refusals = 7;
}

message ListTopResponse {
  repeated TopSubscriber subscribers = 1;
  // Gauge: every subscriber holding a block, whatever `count` was.
  uint32 holding_blocks = 2;
  // `show cgnat top [<n>]`, verbatim.
  string text = 3;
}

message GetDropsRequest {}

message DropCounter {
  // The dataplane's own description of the counter, as the screen prints it.
  string reason = 1;
  // Counter, summed across workers since the dataplane started.
  uint64 count = 2;
  // True for a packet that did not get through; false for everything else
  // the node counted (packets translated, among them).
  bool dropped = 3;
}

message DropNode {
  // "in2out" or "out2in".
  string node = 1;
  // Only the counters that are not zero, drops first.
  repeated DropCounter counters = 2;
}

message DropsReport {
  repeated DropNode nodes = 1;
  // `show cgnat drops`, verbatim.
  string text = 2;
}

message GetCgnatMemoryRequest {}

message CgnatMemory {
  // Gauge, bytes: the dataplane's main heap, where every session and
  // subscriber record lives.
  uint64 heap_bytes = 1;
  // Gauge, bytes: of it, in use.
  uint64 heap_used_bytes = 2;
  // Gauge: sessions now; sessions_known false when the dataplane did not say.
  uint64 sessions = 3;
  bool sessions_known = 4;
  // Gauge: sessions the free part of the heap still holds, at ~300 bytes each.
  uint64 sessions_fit = 5;
  // Counter: sessions refused for want of memory since the dataplane started.
  uint64 refused_no_memory = 6;
  // GB given to the CGNAT (`memory <GB>` under `nat`, `cgnat`); 0 with
  // given false when the box sizes it from the subscriber target.
  uint32 given_gb = 7;
  bool given = 8;
  // True when the heap the dataplane booted with is the figure given; false
  // until the reboot that applies it.
  bool given_in_effect = 9;
  // `show cgnat memory`, verbatim.
  string text = 10;
}

message ListBlocksRequest {}

message BlockCounts {
  // Gauge: blocks in use.
  uint64 in_use = 1;
  // Gauge: blocks this worker's slice (or the pool, in a total) has.
  uint64 blocks = 2;
  // Counters since the dataplane started.
  uint64 allocations = 3;
  uint64 extensions = 4;
  uint64 releases = 5;
  uint64 refusals = 6;
  // Gauge: blocks pinned by a port forward - a subset of in_use that no
  // hold-down gives back.
  uint64 pinned = 7;
}

message WorkerBlocks {
  uint32 thread = 1;
  BlockCounts counts = 2;
  // Gauge: blocks of this slice lent to another worker, neither in use nor
  // free here; 0 when none.
  uint32 lent = 3;
}

message PoolBlocks {
  string pool = 1;
  // True for a deterministic pool's reserve; false for a dynamic pool.
  bool reserve = 2;
  // Seconds a released block is held before it is given again.
  uint32 holddown_seconds = 3;
  // A reserve's blocks per public address, and in all; 0 on a dynamic pool.
  uint32 reserve_per_address = 4;
  uint32 reserve_blocks = 5;
  repeated WorkerBlocks workers = 6;
  BlockCounts total = 7;
  // The extension stride, 0 when none; with it, the extensions placed
  // where it says and the ones that fell back to the free list (counters).
  uint32 stride = 8;
  uint64 stride_placed = 9;
  uint64 stride_fell_back = 10;
  // RFC 4787 REQ-2 paired pooling: extensions on the holder's own public
  // address, of all extensions (counters). paired_shown false where the
  // pool cannot extend at all and the screen says nothing.
  uint64 paired = 11;
  uint64 paired_of = 12;
  bool paired_shown = 13;
  // Counter, a reserve only: a subscriber under max-blocks filled its block
  // and the reserve had nothing left.
  uint64 reserve_exhausted = 14;
}

message ListBlocksResponse {
  repeated PoolBlocks pools = 1;
  // `show cgnat blocks`, verbatim.
  string text = 2;
}

message GetIdentityRequest {}

message IdentityState {
  // False when the box holds no identity table: every record says
  // "unknown". The RADIUS fields are read only while it holds one.
  bool loaded = 1;
  // Gauge: identities held.
  uint32 entries = 2;
  // When they were read, as the dataplane prints it - its own local clock,
  // "YYYY/MM/DD hh:mm:ss:mmm".
  string read_at = 3;
  // True while RADIUS accounting listens, on radius_port.
  bool radius = 4;
  uint32 radius_port = 5;
  // Counters since the dataplane started.
  uint64 received = 6;
  uint64 applied = 7;
  uint64 answered = 8;
  uint64 bad_authenticator = 9;
  uint64 malformed = 10;
  // Gauge: names longer than name_limit characters, carried in part.
  uint32 truncated_names = 11;
  uint32 name_limit = 12;
  // `show cgnat identity`, verbatim.
  string text = 13;
}

message VerifyHistoryRequest {}

message HistoryVerification {
  enum Verdict {
    VERDICT_UNSPECIFIED = 0;
    // Every chained entry verifies, and the file ends where this dataplane
    // last wrote.
    VERDICT_INTACT = 1;
    // No trail at `path`.
    VERDICT_NO_TRAIL = 2;
    // A trail with no chained entry: nothing in it is covered.
    VERDICT_NO_CHAINED_ENTRIES = 3;
    // Entry `entry` does not match its own digest: its text was altered.
    VERDICT_ALTERED = 4;
    // The sequence jumps before entry `entry`: `removed` entries were
    // removed from the middle.
    VERDICT_REMOVED = 5;
    // The file ends part way through an entry: a write stopped.
    VERDICT_TRUNCATED_MID_ENTRY = 6;
    // The file ends at entry file_ends_at and this dataplane wrote up to
    // dataplane_wrote_to: `removed` entries were removed from the end.
    VERDICT_TRUNCATED_END = 7;
  }
  // The trail's path on the box.
  string path = 1;
  Verdict verdict = 2;
  // Entries that verified (VERDICT_INTACT, VERDICT_TRUNCATED_END).
  uint64 checked = 3;
  // Entries written before the chain existed: readable, not covered.
  uint64 unchained = 4;
  // Entries this dataplane could not write since it started: missing from
  // the file and from nowhere else. Any verdict may carry it.
  uint64 unwritten = 5;
  // The entry the verdict names (VERDICT_ALTERED, VERDICT_REMOVED), and its
  // text (VERDICT_ALTERED, VERDICT_TRUNCATED_MID_ENTRY).
  uint64 entry = 6;
  string entry_text = 7;
  uint64 removed = 8;
  // The last verified entry and its digest, to compare with the copy in a
  // remote syslog (VERDICT_INTACT).
  uint64 head_seq = 9;
  string head_sha256 = 10;
  uint64 file_ends_at = 11;
  uint64 dataplane_wrote_to = 12;
  // `show cgnat history verify`, verbatim.
  string text = 13;
}

message ListAlgsRequest {}

message AlgState {
  // ftp, rtsp, pptp, esp, sip.
  string alg = 1;
  bool on = 2;
  // The dataplane's description of it.
  string description = 3;
}

message PoolAlgs {
  string pool = 1;
  repeated AlgState algs = 2;
}

message ListAlgsResponse {
  repeated PoolAlgs pools = 1;
  // `show cgnat alg`, verbatim.
  string text = 2;
}

message ListForwardsRequest {
  // One pool's forwards; empty for every pool's.
  string pool = 1;
}

message Forward {
  string pool = 1;
  // tcp, udp - as the dataplane names the protocol.
  string protocol = 2;
  string public_address = 3;
  uint32 public_port = 4;
  // The inside host: IPv4, or IPv6 on a NAT64 pool.
  string private_address = 5;
  uint32 private_port = 6;
}

message ListForwardsResponse {
  repeated Forward forwards = 1;
  // `show cgnat forward [<pool>]`, verbatim.
  string text = 2;
}

message GetHaStatusRequest {}

message HaRouter {
  string interface = 1;
  uint32 vr_id = 2;
  // As `show cgnat ha` says it: master, backup, initialize.
  string state = 3;
  repeated string addresses = 4;
  string virtual_mac = 5;
  // The priority configured, and the one advertised: lower while something
  // it tracks is down.
  uint32 priority_configured = 6;
  uint32 priority_advertised = 7;
}

message HaDivergence {
  string pool = 1;
  // The pool's mapping statement on each box; empty when only the other
  // box has the pool.
  string here = 2;
  string there = 3;
}

message HaStatus {
  // False when the dataplane did not answer: nothing else is read, and
  // nothing below means the two boxes agree.
  bool dataplane = 1;
  string fingerprint = 2;
  repeated string pools = 3;
  repeated HaRouter routers = 4;
  // The peer's copy: where it was read from, and whether it was. When it
  // was not, peer_unread says why, and nothing says the boxes agree.
  string peer_path = 5;
  bool peer_read = 6;
  string peer_unread = 7;
  string peer_fingerprint = 8;
  repeated string peer_pools = 9;
  // When the copy was written; unset when its age could not be read.
  google.protobuf.Timestamp peer_copied = 10;
  // The pair's VRRP findings, as sentences; empty when it is sound.
  repeated string pair_findings = 11;
  // True when either box carries a virtual router.
  bool routers_either = 12;
  // The pools the two boxes would map differently; empty when every
  // subscriber lands on the same public address and port block on both.
  repeated HaDivergence divergences = 13;
  // True when the peer was read and nothing diverges.
  bool agree = 14;
  // `show cgnat ha`, verbatim.
  string text = 15;
}

// ------------------------------------------- the rest of the screens (#558)

message ListOspfInterfacesRequest {}

message OspfInterface {
  // FRR's name for the interface: the Linux end of the dataplane's pair.
  string name = 1;
  // The area, as ospfd writes it ("0.0.0.0"); "-" when it did not say.
  string area = 2;
  // ospfd's interface state ("DR", "Backup", "DROther", "Point-To-Point",
  // "Waiting", "Down", ...).
  string state = 3;
  // True when the interface sends no hello.
  bool passive = 4;
  // The OSPF cost; -1 when ospfd did not say.
  int32 cost = 5;
  // Gauge: neighbours Full, of `neighbors` known on the interface.
  uint32 adjacent = 6;
  uint32 neighbors = 7;
  // Bytes: the MTU ospfd advertises in its Database Description packets
  // (the TAP's); 0 when ospfd did not say.
  uint32 ospf_mtu = 8;
  // The dataplane's own name for the interface, and its MTU in bytes;
  // dataplane_mtu_known false when the dataplane has no MTU for it - the
  // management port, kept away from the dataplane, has none.
  string dataplane = 9;
  uint32 dataplane_mtu = 10;
  bool dataplane_mtu_known = 11;
  // True when the two MTUs differ the way that stops an adjacency in
  // Exchange; the screen says what to do about it.
  bool mtu_stall = 12;
}

message OspfInterfaces {
  // False when ospfd did not answer: nothing below was read.
  bool answered = 1;
  repeated OspfInterface interfaces = 2;
  // `show ospf interface`, verbatim.
  string text = 3;
}

// ------------------------------------------------------- BFD (#559 phase 2)

message ListBfdSessionsRequest {
  // Empty: every session. An address: the sessions with that neighbour.
  string peer = 1;
}

message BfdSession {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_UP = 1;
    STATE_DOWN = 2;
    STATE_INIT = 3;
    STATE_ADMIN_DOWN = 4;
    // A state bfdd wrote that this server does not know; `status` has it.
    STATE_OTHER = 5;
  }
  // The neighbour's address, RFC 5952 for IPv6.
  string peer = 1;
  // The source address the session runs from; "" when bfdd did not say.
  string local = 2;
  // The interface a single-hop session runs on; "" for multihop.
  string interface = 3;
  // "default" outside a VRF.
  string vrf = 4;
  bool multihop = 5;
  // The profile the session takes its timers from; "" for none.
  string profile = 6;
  State state = 7;
  // bfdd's word for the state, verbatim ("up", "down", "init", ...).
  string status = 8;
  // Gauge, seconds: how long the session has been in `state`.
  uint64 seconds_in_state = 9;
  // Why the session last went down, in bfdd's words ("ok" when it did not);
  // and the neighbour's own diagnostic, "" when bfdd did not say.
  string diagnostic = 10;
  string remote_diagnostic = 11;
  // True for a `peer` statement; false for a session a protocol's `bfd`
  // asked for (bfdd's "dynamic").
  bool configured = 12;
  // This box's timers, milliseconds, as negotiated; 0 when bfdd did not say.
  uint32 detect_multiplier = 13;
  uint32 receive_interval_ms = 14;
  uint32 transmit_interval_ms = 15;
  // How long without a packet before the session goes down, milliseconds.
  uint32 detection_timeout_ms = 16;
  uint32 echo_receive_interval_ms = 17;
  uint32 echo_transmit_interval_ms = 18;
  // The neighbour's timers; 0 while it has not told us (a session down).
  uint32 remote_receive_interval_ms = 19;
  uint32 remote_transmit_interval_ms = 20;
  uint32 remote_detect_multiplier = 21;
  // Multihop only: the lowest TTL accepted; 0 otherwise.
  uint32 minimum_ttl = 22;
  // False when bfdd gave no counters for the session; the five below are
  // then 0 and mean nothing.
  bool counters_known = 23;
  // Counters since bfdd started: control packets in, out, and refused.
  uint64 control_packets_in = 24;
  uint64 control_packets_out = 25;
  uint64 control_packets_bad = 26;
  // Counters: how many times the session came up and went down.
  uint64 session_up_count = 27;
  uint64 session_down_count = 28;
}

message BfdSessions {
  // False when bfdd did not answer: nothing below was read.
  bool answered = 1;
  repeated BfdSession sessions = 2;
  // `show bfd peers` (or `show bfd peer <address>`), verbatim.
  string text = 3;
}

message WatchBfdRequest {
  // 1-60 seconds between readings of bfdd; 0 is 2.
  uint32 interval_seconds = 1;
}

message BfdEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // A session as it was when the call started.
    KIND_INITIAL = 1;
    // A session whose state changed, or whose down counter moved.
    KIND_CHANGED = 2;
    // A session that was not there at the last reading.
    KIND_APPEARED = 3;
    // A session that is no longer there; `session` is its last reading.
    KIND_GONE = 4;
    // bfdd stopped answering (`session` empty); the next answer sends every
    // session again as KIND_INITIAL.
    KIND_UNANSWERED = 5;
  }
  Kind kind = 1;
  google.protobuf.Timestamp at = 2;
  BfdSession session = 3;
  // The state at the previous reading; STATE_UNSPECIFIED for an initial or
  // appeared session.
  BfdSession.State previous_state = 4;
}

message ListIsisInterfacesRequest {}

message IsisInterface {
  string name = 1;
  // The IS-IS instance's area tag.
  string area = 2;
  // isisd's circuit id, as it writes it; "-" when it did not say.
  string circuit_id = 3;
  // isisd's circuit state ("Up", "Down", ...).
  string state = 4;
  bool passive = 5;
  // The circuit type as isisd writes it: "L1", "L2", "L1L2".
  string level = 6;
  // The first level's metric; -1 when isisd did not say.
  int32 metric = 7;
  // Gauge: neighbours up on the circuit, every level summed.
  uint32 active_neighbors = 8;
  // True for an active circuit that is Up with no neighbour: the shape the
  // punt below explains, or a far end not answering.
  bool silent = 9;
}

message IsisInterfaces {
  // False when isisd did not answer.
  bool answered = 1;
  repeated IsisInterface circuits = 2;
  // Read only when there is a circuit. punt_known false when the dataplane
  // could not be asked; otherwise punting says whether it passes IS-IS
  // (NLPID 0x83) to the kernel, without which no hello reaches isisd.
  bool punt_known = 3;
  bool punting = 4;
  // Counter: frames osi-input dropped as an unknown OSI protocol since the
  // dataplane started - hellos arriving with nobody to receive them.
  uint64 osi_drops = 5;
  // `show isis interface`, verbatim.
  string text = 6;
}

message GetHardwareRequest {}

message HardwareNic {
  // Linux's name for the card.
  string name = 1;
  // PCI address, "0000:06:12.0".
  string pci = 2;
  // The kernel driver bound to it; "" when none is.
  string driver = 3;
  // True when that driver is one DPDK can use (vfio-pci, uio_pci_generic).
  bool dpdk_driver = 4;
  // RFC 2863 operstate as Linux has it ("up", "down", "unknown", ...).
  string link = 5;
  // Megabits per second; 0 when the kernel does not say (a link that is down).
  uint32 speed_mbps = 6;
  string mac = 7;
  // True for the card that carries the default route: handing it to the
  // dataplane moves how this box is reached.
  bool default_route = 8;
}

message Hardware {
  // False when the dataplane could not be asked what it holds: a card it
  // took is then missing from `nics` with nothing to say so.
  bool dataplane_answered = 1;
  // The interfaces the dataplane holds (local0 aside). A card the dataplane
  // owns is no longer Linux's, so it is here and not in `nics`.
  repeated string dataplane_holds = 2;
  repeated HardwareNic nics = 3;
  // The card carrying the default route; "" when none does.
  string default_route_interface = 4;
  // `show hardware`, verbatim.
  string text = 5;
}

message GetRoutingLoggingRequest {}

message LoggingTarget {
  // False for "disabled".
  bool enabled = 1;
  // The lowest severity logged ("debugging", "informational", "warnings",
  // "errors", ...); "" when disabled.
  string level = 2;
  // syslog's facility and ident; the file's filename. "" where not written.
  string facility = 3;
  string ident = 4;
  string filename = 5;
}

message DaemonLogging {
  // "zebra", "bgpd", "ospfd", ...
  string daemon = 1;
  LoggingTarget syslog = 2;
  LoggingTarget stdout = 3;
  LoggingTarget file = 4;
  // FRR's protocol name ("ZEBRA", "OSPF").
  string protocol = 5;
  bool record_priority = 6;
  bool record_severity = 7;
  // Digits after the second in each record's timestamp, 0-6.
  uint32 timestamp_precision = 8;
}

message RoutingLogging {
  // One per daemon running, in FRR's order; empty when FRR did not answer.
  repeated DaemonLogging daemons = 1;
  // `show logging`, verbatim.
  string text = 2;
}

message GetSnmpFileRequest {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // PRISMA-ROUTING-MIB (`show snmp mib`).
    KIND_MIB = 1;
    // The Zabbix 7.0 template (`show snmp zabbix-template`).
    KIND_ZABBIX_TEMPLATE = 2;
  }
  Kind kind = 1;
}

message SnmpFile {
  // A name to save it under: "PRISMA-ROUTING-MIB.txt" or
  // "prisma-routing-zabbix.json".
  string filename = 1;
  // "text/plain" for the MIB, "application/json" for the template (Zabbix
  // 7.0 imports it as is).
  string media_type = 2;
  // The enterprise number filled in, the one the agent serves under.
  string enterprise_number = 3;
  // The file itself, exactly what the VTY prints.
  string content = 4;
}

message ProbeRequest {
  // An address or a hostname, as the VTY takes it.
  string host = 1;
  // ping: packets; traceroute: the hop ceiling; mtr: report cycles. 1-100;
  // 0 is the VTY's default, 5.
  uint32 count = 2;
  // An address this box holds to send from; "" lets the kernel choose.
  string source = 3;
}

message PingReply {
  // icmp_seq, the reply's TTL, and the round trip in milliseconds.
  uint32 sequence = 1;
  string from_address = 2;
  uint32 ttl = 3;
  double rtt_ms = 4;
}

message TraceHop {
  // traceroute: the hop number, the address that answered ("" for "*",
  // answered false) and the round trip in milliseconds.
  uint32 hop = 1;
  string address = 2;
  bool answered = 3;
  double rtt_ms = 4;
}

message MtrHop {
  // mtr --report: one per hop, all at the end of the run. "???" is an
  // address that never answered, written as "" with answered false.
  uint32 hop = 1;
  string address = 2;
  bool answered = 3;
  // Percent, 0-100.
  double loss_percent = 4;
  uint32 sent = 5;
  // Milliseconds.
  double last_ms = 6;
  double avg_ms = 7;
  double best_ms = 8;
  double worst_ms = 9;
  double stdev_ms = 10;
}

message ProbeEnd {
  // The tool's exit status: ping exits 1 when no reply came, and 124 is the
  // box stopping a tool still running after 300 s.
  int32 exit_status = 1;
  bool stopped_at_deadline = 2;
  // ping's summary, when it printed one: packets sent and received, loss
  // in percent, and the round trips' min/avg/max/mdev in milliseconds
  // (rtt_known false when there was no reply to measure).
  uint32 transmitted = 3;
  uint32 received = 4;
  double loss_percent = 5;
  bool rtt_known = 6;
  double rtt_min_ms = 7;
  double rtt_avg_ms = 8;
  double rtt_max_ms = 9;
  double rtt_mdev_ms = 10;
}

message ProbeEvent {
  // The line the tool printed, as the VTY shows it; empty on `end`.
  string line = 1;
  oneof kind {
    PingReply reply = 2;
    TraceHop hop = 3;
    MtrHop mtr_hop = 4;
    ProbeEnd end = 5;
  }
}

message ClearRequest {
  enum Target {
    TARGET_UNSPECIFIED = 0;
    // `clear interface counters [<name>]`: `name` one interface, empty all.
    TARGET_INTERFACE_COUNTERS = 1;
    // `clear cgnat subscriber <name>`: every session of the subscriber at
    // inside address `name`; its block goes after the hold-down.
    TARGET_CGNAT_SUBSCRIBER = 2;
    // `clear bgp <name> [soft [in|out]]`: the neighbour `name`, by `bgp`.
    TARGET_BGP = 3;
    // `clear ospf process`.
    TARGET_OSPF_PROCESS = 4;
    // `clear ospf neighbor <name>`.
    TARGET_OSPF_NEIGHBOR = 5;
    // `clear isis adjacency [<name>]`: one system id, or every adjacency.
    TARGET_ISIS_ADJACENCY = 6;
  }
  Target target = 1;
  string name = 2;
  enum BgpMode {
    // The session is reset.
    BGP_HARD = 0;
    // Policy re-applied both ways, without a reset.
    BGP_SOFT = 1;
    BGP_SOFT_IN = 2;
    BGP_SOFT_OUT = 3;
  }
  BgpMode bgp = 3;
}

message ClearResponse {
  // What the VTY printed for it.
  string output = 1;
  // The line run, as the VTY spells it.
  string command = 2;
}

