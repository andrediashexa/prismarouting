# Drop-in for vpp.service: let the "vpp" group use the binary API.
#
# "api-segment { gid vpp }" group-owns /dev/shm/vpe-api and NOT
# /dev/shm/global_vm. A client maps BOTH, so a non-root account gets
#
#   svm_region_map(mmap open): Permission denied
#
# and the VTY reports a timeout it cannot explain. Without this, every operator
# on the appliance has to be root - which is the thing roles exist to stop, and
# it would make them decorative rather than wrong, which is worse: the box
# would report a role boundary it does not have.
#
# Corrected here rather than in the lab. lab/vty.sh has been doing exactly this
# by hand since roles were built, which is the same shape as #119: the lab
# arranged an environment the product never produced, and the assertion passed
# on a box nobody ships.
#
# The wait is not decoration. VPP creates the segment while it initialises, so
# ExecStartPost can and does run first; without the loop this silently changed
# nothing on a slower box. It gives up rather than blocking the unit - a
# dataplane that will not start because a permission could not be set is worse
# than one an operator has to be root to configure.
#
# THE SHELL MOVED OUT OF THIS FILE (#426). The same thing has to be done for
# the dataplane in a container, which shares this host's /dev/shm, and the
# rule about which group owns the segment must not be written down twice -
# a second copy is one that can be corrected in one place and not the other.
# appliance/share-the-api-segment is that one copy, and
# test/test_share_api_segment.sh drives it.
[Service]
ExecStartPost=/usr/lib/prisma-routing/share-the-api-segment
