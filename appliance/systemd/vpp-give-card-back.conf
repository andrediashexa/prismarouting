# Drop-in for vpp.service: a box must not be stranded by a dataplane that will
# not start.
#
# apply-tuning hands the card to a DPDK driver before VPP starts, because DPDK
# cannot take a device the kernel still holds. Between that bind and a working
# dataplane the card belongs to neither, and if VPP never comes up the box
# stays there: no kernel interface, no dataplane interface, reachable only from
# a console somebody has to walk to. An operator reported exactly that on
# 0.75.0 (#379).
#
# OnFailure and not OnFailure= on every restart: vpp.service carries
# Restart=always, so systemd only marks it `failed` once the restart limit is
# hit. A dataplane that crashes once still gets its retries; one that cannot
# start at all gives the card back.
[Unit]
OnFailure=hexarouting-give-card-back.service
