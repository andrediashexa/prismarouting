# Drop-in for vpp.service: the dataplane in a slice of its own (#466).
#
# The control plane is held off the isolated CPUs by AllowedCPUs on
# system.slice, set at every boot by apply-tuning. vpp.service is in
# system.slice by default, and would be held there with it - its workers
# pinned to CPUs its cgroup no longer allows. The container path puts VPP in
# the same slice through compose's cgroup_parent.
[Service]
Slice=prisma-dataplane.slice
