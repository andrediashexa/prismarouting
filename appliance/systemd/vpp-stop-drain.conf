# Drop-in for vpp.service: close the retention log before the box stops.
#
# In dynamic mode the block allocation log IS the connection record the Marco
# Civil requires to be kept for a year, and it is read as "the last allocation
# before the instant asked about". A block held when the dataplane stops used
# to leave an allocation OPEN in that log, for ever - so every planned reboot
# and every upgrade left the box answering "who held 203.0.113.16:1030 at
# 14:22" with a subscriber who had already been disconnected (#217).
#
# WHY AN ExecStop AND NOT ONLY THE IN-PROCESS HOOK. The plugin does register a
# VLIB_MAIN_LOOP_EXIT function, and it runs on SIGTERM - measured. What it
# cannot do is deliver over UDP: VPP's UDP IPFIX export is not a kernel socket,
# it is a packet the DATAPLANE sends, handed to ip4-lookup as a frame, and the
# graph has already stopped by the time any exit hook is reached. The record is
# written and swallowed. Over TCP the exit hook works, because that exporter
# owns a kernel socket. So the drain that covers UDP has to be asked for while
# the graph is still running, which is what ExecStop is: systemd runs it, waits
# for it, and only then sends the signal.
#
# The in-process hook stays as the backstop for every exit systemd does not
# make - a kill from elsewhere, `vppctl quit`, a crash of the control plane -
# and the two do not double up: the drain latches, and the hook sees the latch.
#
# NEITHER OF THEM CAN COVER A POWER LOSS, and nothing can. That is what the
# boot marker is for: the box announces, on every restart, when this
# incarnation of the dataplane started (IE 160, systemInitTimeMilliseconds), so
# a collector can tell an allocation that is still in force from one the box
# died holding. See docs/logging.md.
#
# "-" because a dataplane that is already gone is not a failure of the stop:
# vppctl would report a socket it cannot reach, and refusing to stop a unit
# over that would leave the box unable to reboot.
#
# A drop-in on VPP's own unit, and not on hexarouting.service, for two reasons:
# the blocks are held in the VPP process, and hexarouting.service says in as
# many words why it has no ExecStop - stopping the control plane must not touch
# a production pool.
[Service]
ExecStop=-/usr/bin/vppctl bpa stop-drain
