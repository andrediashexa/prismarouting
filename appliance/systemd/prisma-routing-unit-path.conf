# A drop-in for prisma-routing.service, installed by install.sh on a box whose
# dataplane is vpp.service and removed on one whose dataplane is the
# containers (#459): the configuration loader is stopped and restarted with
# the dataplane this box runs, and not with the other one. PartOf both was a
# transaction systemd refuses on every container box - see the unit.
[Unit]
PartOf=vpp.service
