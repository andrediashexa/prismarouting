# Drop-in for vpp.service: take the dataplane out of the OOM killer's choice.
#
# This is not a hypothesis. docs/appliance.md records the measurement: booting
# the ISO with 2 GB produced "Out of memory: Killed process (vpp)" with VPP
# holding 19 MB resident. It was not the glutton, it was the chosen victim -
# the kernel selects by badness score, not by who caused the shortage. The
# answer at the time was "require 4 GB", which raises the floor and leaves the
# victim exactly as exposed once something else on the box grows.
#
# What grows is the control plane. A bgpd holding a full table is the process
# that moves, and every time it does the kernel gets to pick again: one full
# IPv4 table costs bgpd 837 MB resident, with zebra at 553 MB behind it,
# against 13 and 10 MB on a box taking default routes only (measured; the
# numbers and the method are in docs/appliance.md).
#
# Session tables were thought to push the pick towards VPP as well, on the
# belief that the OOM killer counts virtual memory. It does not, and lab/oom.sh
# measures it: VPP with 17 GB mapped and 354 MB resident inside a 502 MB cgroup
# scores 670 out of 1000, which is its RESIDENT share, and the kernel's own
# kill line reads "total-vm:17476328kB, anon-rss:247984kB". So raising "bpa
# session-table memory <MB>" raises VPP's badness only as the table is used.
# The reason to protect the dataplane is the plainer one: on a box where
# nothing else is resident, the dataplane is the biggest thing there, which is
# how it came to be killed while holding 19 MB.
#
# -1000 removes VPP from selection entirely rather than merely lowering it,
# because the trade is not close: a box that lost bgpd still forwards on what
# it already learned, and a box that lost VPP forwards nothing at all. If VPP
# is genuinely the process consuming the machine, the kernel still kills it -
# -1000 protects it from being chosen for someone else's allocation, not from
# its own.
[Service]
OOMScoreAdjust=-1000
