# Made at every boot by systemd-tmpfiles (#448, phase C).
#
# /run/prisma-routing/vty is where a login with no runtime directory of its
# own (no libpam-systemd on this medium, so a console login has none) puts
# its VTY session's socket, so the management plane's container - which
# shares /run/prisma-routing - can reach it. 1733, like /tmp: anybody may
# make a directory here, nobody may list it, and nobody may remove what is
# not theirs.
d /run/prisma-routing     0755 root root -
d /run/prisma-routing/vty 1733 root root -
#
# /run/prisma-routing/state is what the box says about itself for the SNMP
# agent (#524): the self-test's verdict and the configuration's commits, a
# few lines with nothing secret in them, each file 0644. The agent runs as
# Debian-snmp and must not read /etc/prisma-routing, whose revisions carry
# password hashes; the VTY writes here as whichever operator committed, so
# the group is theirs and setgid keeps it.
d /run/prisma-routing/state 2775 root prisma-cgnat -
