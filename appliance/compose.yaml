# The two containers, and the one thing Compose cannot do for them.
#
# NOTHING ON AN INSTALLED BOX STARTS THIS YET. The appliance runs VPP and FRR
# as systemd units; this file is #396 phase 2's shape, and it is here because
# `sh tools/build-images.sh compose-check` drives it - a file nothing runs is
# a file nobody has seen work.
#
# ONE NETWORK NAMESPACE, WHATEVER THE CONTAINER COUNT, and this is not a
# convenience. Every dataplane card is paired into Linux by linux_cp under its
# own name, and on a one-card box the address the operator reaches moves onto
# that pair - the box is reached THROUGH the dataplane. FRR routes over those
# TAPs and prismash reads them, so all of them must be in the namespace VPP
# runs in. Docker's network isolation is therefore not available to this
# product, for the control path as much as for the packet path (#396 s3p1).
services:
  vpp:
    # A SLICE OF ITS OWN, out of system.slice (#466). The control plane is
    # held off the isolated CPUs by AllowedCPUs on system.slice, and Docker
    # otherwise puts every container there - VPP's workers would be held to
    # the control plane's CPUs with it. Measured on a 4-CPU guest: in this
    # slice the workers stay on 1, 2 and 3 while system.slice is fenced to 0.
    cgroup_parent: prisma-dataplane.slice
    image: prisma-vpp:${PRISMA_VERSION:-latest}
    network_mode: host
    pid: host
    # THE HOST'S /dev/shm, AND THE VTY IS WHY (#426). prismash runs on the
    # box and not in a container - it is a host tool, which is one of the
    # costs written on #396 - and it reaches the dataplane by mapping
    # /dev/shm/global_vm and /dev/shm/vpe-api. Docker gives a container its
    # own 64 MB /dev/shm by default, and measured on 2026-09-21 that is
    # exactly what happens: the two segments appear INSIDE the container and
    # the host's /dev/shm stays empty, so the VTY has no binary API at all
    # and every commit fails.
    #
    # With `ipc: host` they appear on the host, 660 root:root - which is why
    # prisma-routing-containers.service runs share-the-api-segment after
    # `up`, the same script vpp.service's own drop-in runs.
    ipc: host
    # THE BOX'S vpp GROUP, passed in as a number by the unit that starts
    # this stack. VPP resolves `gid vpp` from startup.conf in the
    # CONTAINER's /etc/group, and /run/vpp is a bind mount - so without
    # this the CLI socket is group-owned on the box by a gid that is
    # nobody's, and an operator account is told "the dataplane is not
    # answering" by a dataplane that answers root. Empty on a box that has
    # no vpp group, where the entrypoint leaves the image's own.
    environment:
      - PRISMA_VPP_GID=${PRISMA_VPP_GID:-}
    # NOT `privileged: true`, and every line of this was measured on
    # 2026-09-21 by starting the image with the privilege removed and reading
    # what broke (#396):
    #
    #   nothing at all      set_mempolicy: Operation not permitted
    #                       dpdk_config: rte_eal_init failed: Cannot allocate
    #                       memory (12)                     -> the EAL is dead
    #   SYS_NICE dropped    the same two lines               -> dead
    #   NET_ADMIN dropped   create tap: ioctl(TUNSETIFF):
    #                       Operation not permitted          -> no linux_cp
    #   IPC_LOCK dropped    nothing, on this box             -> see below
    #
    # SYS_NICE is what DPDK's EAL needs for set_mempolicy; without it the
    # dataplane does not start at all. NET_ADMIN is what creates the TAP, and
    # linux_cp pairs every dataplane card into Linux through one - a box
    # without it has a control plane with nothing to route over, which on a
    # one-card box is a box nobody can reach.
    #
    # IPC_LOCK IS NOT EXERCISED HERE and is kept anyway, which is the one
    # entry that is not a measurement: it is the locked memory VFIO needs to
    # map DMA, and this machine has no IOMMU and no card DPDK can bind - the
    # same hardware gap #28 records. Removing it on the strength of a box
    # that cannot test it would be measuring the wrong thing.
    #
    # SYS_ADMIN IS FOR A PHYSICAL ADDRESS, AND IT IS THE NARROWEST THING
    # THAT WORKS. On a box whose hugepages are 2M the dataplane must address
    # its card by physical address - `iova-mode pa`, see
    # appliance/prisma-routing-tune and #428 - and DPDK reads those out of
    # /proc/self/pagemap. Since Linux 4.0 the kernel zeroes the PFN for a
    # reader without CAP_SYS_ADMIN, DPDK cannot tell that from "no physical
    # addresses available", and rte_eal_init returns EINVAL:
    #
    #   vpp[1]: dpdk_config: rte_eal_init failed: Invalid argument (22)
    #
    # Measured on 2026-09-23, this image, a 2M host, one variable changed:
    #
    #   SYS_NICE NET_ADMIN IPC_LOCK            EINVAL (22)
    #   ... + PERFMON                          EINVAL (22)
    #   ... + SYS_ADMIN                        the dataplane stayed up
    #
    # PERFMON was tried FIRST and is the narrower capability - since 5.8 it
    # is meant to cover exactly this - and on this kernel it does not. So
    # the entry is SYS_ADMIN, because a capability that does not work is not
    # a smaller risk, it is a box that does not forward.
    #
    # The control plane below already has SYS_ADMIN for its own reasons, so
    # this does not add a capability to the stack that was not in it.
    cap_add:
      - SYS_NICE
      - NET_ADMIN
      - IPC_LOCK
      - SYS_ADMIN
      # SYS_RAWIO IS FOR A CARD WHOSE REGISTERS ARE PORTS, not memory.
      #
      # A LEGACY virtio-net device - PCI id 1af4:1000, which is what qemu
      # and Proxmox give a guest unless told otherwise - keeps its registers
      # in an I/O BAR. DPDK finds that port under
      # /sys/class/uio/uioX/portio/ when igb_uio bound the card, and
      # uio_pci_generic CREATES NO SUCH DIRECTORY - measured on the box:
      # `ls /sys/class/uio/uio0/portio/` is "No such file or directory". So
      # DPDK falls back to iopl(), and iopl() needs CAP_SYS_RAWIO.
      #
      # Without it the dataplane STARTS and takes no port. That is the worst
      # shape available: `show version` answers, `show interface` has only
      # local0, and nothing anywhere says the card was refused.
      #
      # Measured on 2026-09-23 on one installed box, one boot, the stack
      # taken down and brought up twice - the recreate is the control:
      #
      #   [IPC_LOCK NET_ADMIN SYS_ADMIN SYS_NICE]            local0 only
      #   [IPC_LOCK NET_ADMIN SYS_ADMIN SYS_NICE SYS_RAWIO]  ens9 up, rx/tx
      #
      # And on the unit path, root with every capability, the same card and
      # the same startup.conf come up - which is what says this is the
      # container boundary and not the PMD (#428).
      - SYS_RAWIO
    devices:
      # The TAP linux_cp creates, and the vhost backend it asks for next:
      # with NET_ADMIN and no /dev/net/tun the failure is
      # "open '/dev/net/tun': No such file or directory", and with the tun
      # device and no /dev/vhost-net it moves on to that one. Both, and the
      # interface appears: `tap0` in `show interface`.
      - /dev/net/tun
      - /dev/vhost-net
    # /dev/vfio IS DELIBERATELY NOT HERE. Compose refuses to start a service
    # whose device is missing, and a box with no IOMMU has no /dev/vfio at
    # all - appliance/bind-dataplane-nic falls back to uio_pci_generic on
    # exactly those boxes and says so. Which device the dataplane is handed
    # follows from what that script chose, so it belongs in the override the
    # box generates, beside the card's own address - and that is the next
    # piece of phase 2, not a line to guess at now.
    volumes:
      - /dev/hugepages:/dev/hugepages
      - /etc/vpp:/etc/vpp:ro
      - /run/vpp:/run/vpp
      # THE RETENTION LOG, on its own filesystem and under a one-year
      # obligation. It is bind-mounted rather than left in the container for
      # the obvious reason and one more: the audit trail's chain must not
      # break because a container was replaced.
      - /var/log/prisma-routing:/var/log/prisma-routing
      # THE DATAPLANE'S OWN LOG, and on the host so it survives the container
      # being recreated - which `down`/`up` does on every start. Without it
      # VPP says `unix_config:445: couldn't open log '/var/log/vpp/vpp.log'`
      # and throws away everything it would have written: on a box whose
      # dataplane will not start, that file is the only account of why, and
      # `docker logs` carries two lines of it (#428).
      - /var/log/vpp:/var/log/vpp
    # LONGER THAN THE DRAIN, WITH THE MEASUREMENT BEHIND IT. `docker stop`
    # sends SIGTERM, waits this long, and then SIGKILLs - and the entrypoint
    # runs the drain before it forwards the signal. lab/ipfix-stop.sh measures
    # that drain at 504 ms for one block, of which 500 ms is a deliberate
    # `vlib_process_suspend` waiting for the frame carrying the UDP records to
    # go out. The SLOPE is measured too, in lab/drain-slope.sh: 503 ms at one
    # block and 504-505 at eight hundred, under 0.005 ms a block - so a box
    # holding 200,000 of them spends about a second more than a box holding
    # one, and 30 s has room by a factor of about twenty-five rather than
    # being a number that sounded safe.
    stop_grace_period: 30s
    # OUT OF THE OOM KILLER'S CHOICE, the same -1000 vpp-oom-protect.conf
    # puts on vpp.service and for the same reason: the dataplane came to be
    # killed on a 2 GB box while holding 19 MB resident, because on a box
    # where nothing else is resident it is the biggest thing there. A box
    # that lost bgpd still forwards on what it learned; a box that lost VPP
    # forwards nothing. The drop-in's comment carries the measurements.
    #
    # THAT IT REACHES THE KERNEL IS MEASURED AND NOT ASSUMED. docker-compose
    # 1.29.2 - the version the medium carries - parses `oom_score_adj` under
    # the 3.9 schema this file resolves to, passes it as HostConfig.
    # OomScoreAdj, and the container's PID 1 reads -1000 back out of
    # /proc/<pid>/oom_score_adj. The dataplane inherits it: oom_score_adj is
    # carried across fork, and vpp-entrypoint is the parent.
    oom_score_adj: -1000
    # `on-failure:5` AND NOT `unless-stopped`, AND THE REASON IS THE CARD.
    #
    # The card is bound to a DPDK driver before the dataplane starts, so
    # between the bind and a working dataplane it belongs to neither Linux
    # nor VPP. A box left in that window has no interface at all and the only
    # way in is a console somebody walks to - the state an operator reported
    # on 0.75.0 (#379). vpp.service answers it by REACHING `failed` after its
    # restart limit, which is what raises OnFailure= and gives the card back.
    #
    # `unless-stopped` never gives up, so a dataplane that cannot start would
    # be restarted for ever and the box would stay stranded for ever - which
    # is strictly worse than the unit path, on the failure the unit path was
    # built for. Five attempts and then stop, measured under docker-compose
    # 1.29.2: the policy arrives as on-failure with MaximumRetryCount 5 and
    # the container is left `exited`.
    #
    # And the note the line it replaces got wrong: `unless-stopped` restarts
    # a clean exit too - the only thing it does not restart is a container
    # somebody stopped by hand. `on-failure` is what actually leaves a
    # dataplane that exited 0 alone.
    #
    # NOTHING RESTARTS IT A SIXTH TIME. appliance/watch-the-dataplane notices
    # that it stopped and undoes the bind; a retry from there would be a
    # second opinion about the same failure.
    restart: "on-failure:5"

  frr:
    image: prisma-frr:${PRISMA_VERSION:-latest}
    network_mode: host
    # It routes over the TAPs VPP creates, so it has nothing to do until they
    # exist. This orders the start and nothing more: Compose's depends_on
    # does not wait for readiness, and FRR retries.
    depends_on:
      - vpp
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - NET_RAW
    volumes:
      - /etc/frr:/etc/frr
      - /var/run/frr:/var/run/frr
      # SNMP from the routing daemons (#502): the AgentX socket snmpd listens
      # on, and snmpd.conf read-only - the entrypoint puts `agentx` in
      # frr.conf exactly while that file exists, which is while SNMP is on.
      - /var/agentx:/var/agentx
      - /etc/snmp:/etc/snmp:ro
    restart: unless-stopped

  # THE MANAGEMENT PLANE (#448, phase C): the container the VTY runs in.
  #
  # NO NETWORK OF DOCKER'S. A docker network would put routes in the main
  # table and rules in iptables, which is the leak #447's VRF exists to
  # prevent. The container starts with none, and prisma-backplane attach
  # gives it one veth on bp0, 128.0.0.2/8, in prisma-bp. From there it
  # reaches the host (128.0.0.1) and nothing outside: the VRF's table ends
  # in an unreachable default. What it needs of the host it asks through the
  # doors (/run/prisma-routing/doors.sock).
  #
  # WHAT IT SHARES, each for one reason:
  #   ipc: host             vat2 talks to VPP over /dev/shm/global_vm
  #   /run/vpp              the dataplane's CLI socket, for vppctl
  #   /var/run/frr, /etc/frr  vtysh and frr-reload.py, and the file FRR saves
  #   /etc/prisma-routing   the configuration, its revisions and the confirm store
  #   /run/prisma-routing   the doors' socket
  #   /run/user             a session's broker socket, under the login's own
  #                         runtime directory (#448's broker)
  #   /var/log/prisma-routing  the audit trail and the records
  #   /etc/passwd, group, shadow: links in the image into
  #                         /run/prisma-routing/accounts, which the host's doors
  #                         keep current (#532) - a mount of the FILES pinned
  #                         their inodes, and an account created after the
  #                         container started was invisible to it
  #   /usr/share/prisma-routing, read-only: the VERSION stamp `show version`
  #                         reads, which the image does not carry
  mgmt:
    image: prisma-mgmt:${PRISMA_VERSION:-latest}
    network_mode: none
    ipc: host
    init: true
    depends_on:
      - vpp
      - frr
    volumes:
      - /run/vpp:/run/vpp
      - /var/run/frr:/var/run/frr
      - /etc/frr:/etc/frr
      - /etc/prisma-routing:/etc/prisma-routing
      - /run/prisma-routing:/run/prisma-routing
      - /run/user:/run/user
      - /var/log/prisma-routing:/var/log/prisma-routing
      - /usr/share/prisma-routing:/usr/share/prisma-routing:ro
      # The box's timezone, which the installer asked for: the VTY prints
      # times with localtime(), and the image's own is UTC.
      - /etc/localtime:/etc/localtime:ro
      # THE HOST'S FACTS, READ-ONLY UNDER /host (#448): the NICs, the PCI
      # bus, the CPUs and the control plane's cgroup in /sys, the routes of
      # the host's own network namespace in /proc/1/net, the live medium,
      # the dataplane's startup.conf, the management card's stanza, the
      # installer's presence. Read at the container's own paths they are the
      # container's - measured on 0.137.0's first gate, where the VTY in here
      # told the live medium's operator to reboot. The subtrees and not /:
      # / would bring /run, and /run/docker.sock is a socket a read-only
      # bind does not stop anybody connecting to.
      - /sys:/host/sys:ro
      - /proc:/host/proc:ro
      - /run/live:/host/run/live:ro
      - /etc/vpp:/host/etc/vpp:ro
      - /etc/network:/host/etc/network:ro
      - /usr/sbin:/host/usr/sbin:ro
    # Every host path the VTY reads, pointed at /host. test/test_mgmt_reads_host.py
    # holds this list to the reads in prismash.py.
    environment:
      - PRISMA_LIVE_SQUASHFS=/host/run/live/medium/live/filesystem.squashfs
      - PRISMA_INSTALLER=/host/usr/sbin/prisma-routing-install
      - PRISMA_CPU_ISOLATED=/host/sys/devices/system/cpu/isolated
      - PRISMA_CPU_ONLINE=/host/sys/devices/system/cpu/online
      - PRISMA_CPU_FENCE=/host/sys/fs/cgroup/system.slice/cpuset.cpus.effective
      - PRISMA_CP_MEMORY_NOW=/host/sys/fs/cgroup/system.slice/memory.current
      - PRISMA_MEMINFO=/host/proc/meminfo
      - PRISMA_STARTUP_CONF=/host/etc/vpp/startup.conf
      - PRISMA_PCI_DEVICES=/host/sys/bus/pci/devices
      - PRISMA_PCI_DRIVERS=/host/sys/bus/pci/drivers
      - PRISMA_MGMT_CONF=/host/etc/network/interfaces.d/prisma-routing
      - PRISMA_SYS_CLASS_NET=/host/sys/class/net
      - PRISMA_PROC_NET_ROUTE=/host/proc/1/net/route
      # The kernel's boot time, for show system uptime (#534).
      - PRISMA_PROC_STAT=/host/proc/stat
      - PRISMA_PROC_CMDLINE=/host/proc/cmdline
      # The CPUs, the NUMA nodes and the hugepage pools, the machine's DMI
      # identity and the CPUs' flags, for show system tuning advice (#596).
      - PRISMA_SYS_DEVICES=/host/sys/devices
      - PRISMA_DMI=/host/sys/class/dmi/id
      - PRISMA_CPUINFO=/host/proc/cpuinfo
      # AND WHAT ACTS ON THE HOST, OR ASKS IT, GOES THROUGH ITS DOORS (#448):
      # the probes (this network ends at the backplane), which unit runs the
      # dataplane, the ssh host keys' origin, the driver DPDK would get.
      - PRISMA_IN_MGMT=1
    restart: unless-stopped

  # THE LOG CONTAINER (#550): prisma-logd carries the CGNAT's TCP log streams -
  # syslog and IPFIX over TCP, their spill files, the replay of those files
  # and reconnection - so that none of it runs in the dataplane. VPP copies
  # each event into the export ring of /dev/shm/prisma-bpa-log and does
  # nothing else for these streams while this container's heartbeat is fresh;
  # when it stops, VPP carries them again within a second.
  #
  # WHAT IT SHARES, each for one reason:
  #   network_mode: host    its sockets are the ones VPP's were: the host's
  #                         namespace, the same route, source and VRF to the
  #                         collector
  #   ipc: host             /dev/shm/prisma-bpa-log, the segment VPP creates
  #   /var/log/prisma-routing  the spill files, which VPP replays when it
  #                         carries the streams again
  # NO cgroup_parent: like FRR and the VTY it stays in system.slice, which the
  # tuner fences to the control-plane CPUs (#466) - never a worker's.
  # And A MEMORY LIMIT of its own: whatever a collector does, this container
  # is what runs out, never the dataplane.
  logger:
    image: prisma-log:${PRISMA_VERSION:-latest}
    network_mode: host
    ipc: host
    init: true
    depends_on:
      - vpp
    volumes:
      - /var/log/prisma-routing:/var/log/prisma-routing
      - /etc/localtime:/etc/localtime:ro
    mem_limit: 256m
    # It spills what it holds and gives the streams back on SIGTERM.
    stop_grace_period: 20s
    restart: unless-stopped

  # PPPOE SUBSCRIBER TERMINATION (#597): accel-ppp-ng and its RADIUS client,
  # driving VPP's pppoe plugin. A container of its own, decided on #597:
  #   * a crash, a leak or an OOM in accel-ppp must not take forwarding,
  #     routing or the VTY with it - so its own memory and process limits,
  #     and the OOM killer's FIRST choice rather than the dataplane;
  #   * restarted, upgraded and enabled on its own: not in `mgmt`, which is
  #     recreated on every VTY upgrade and would drop every session at each
  #     patch; not in `vpp`, which would carry a large control daemon and its
  #     RADIUS secrets into the dataplane's image.
  #
  # NOT STARTED BY `up`: the profile keeps it out, so a box with no PPPoE
  # never runs it. appliance/prisma-bng starts it by name when the VTY has
  # generated a configuration - measured with docker-compose 1.29.2 (the
  # medium's) on 2026-10-12: a plain `up` leaves a profiled service alone,
  # `up <service>` starts it, and `down` removes it either way.
  #
  # WHAT IT SHARES, each for one reason:
  #   network_mode: host    the pppoe-cp TAP VPP creates is in the host's
  #                         namespace, and RADIUS is reached by the host's
  #                         routes - the same reason as logger's
  #   /run/vpp              the binary API's socket (accel-ppp's VAPI) and the
  #                         stats socket (each session's counters, for
  #                         accounting), as mgmt has it; and vppctl's socket,
  #                         for the plumbing and the session hook
  #   /etc/prisma-routing/bng, read-only: the configuration the VTY generated
  #   /run/prisma-routing/bng  its run state: the CLI password, which the
  #                         host's prisma-bng uses through `docker exec`
  #   /var/log/prisma-routing  accel-ppp's own log, under bng/
  # NO ipc: host. accel-ppp-ng's VAPI connects over the socket (use_uds),
  # not over shared memory, so the host's IPC namespace is not needed.
  bng:
    image: prisma-bng:${PRISMA_VERSION:-latest}
    profiles: ["bng"]
    network_mode: host
    init: true
    depends_on:
      - vpp
    cap_add:
      # The VLAN devices on pppoe-cp and its MAC (NET_ADMIN); the raw
      # sockets discovery and the sessions' control frames use (NET_RAW).
      - NET_ADMIN
      - NET_RAW
    volumes:
      - /run/vpp:/run/vpp
      - /etc/prisma-routing/bng:/etc/prisma-routing/bng:ro
      - /run/prisma-routing/bng:/run/prisma-routing/bng
      - /var/log/prisma-routing:/var/log/prisma-routing
      - /etc/localtime:/etc/localtime:ro
    # THE LIMITS, so that what goes wrong in here stays in here. accel-ppp
    # holds about 10 kB a session (its own `show stat` in lab/pppoe.sh reads
    # 9.5 MB resident for three); 512 MB is room for tens of thousands and
    # a ceiling the rest of the box never pays for. The OOM killer takes
    # this before anything else (+500, where the dataplane is -1000).
    mem_limit: 512m
    pids_limit: 512
    oom_score_adj: 500
    # accel-ppp sends PADT and Accounting-Stop for every session on SIGTERM.
    stop_grace_period: 20s
    restart: unless-stopped
