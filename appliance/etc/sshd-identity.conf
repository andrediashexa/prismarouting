# Installed by appliance/install.sh (#438). Debian's sshd appends its
# package version to the banner it sends before any login, so every scanner
# on the network reads the distribution. Measured on debian:12, 2026-09-24:
#   without this file  SSH-2.0-OpenSSH_9.2p1 Debian-2+deb12u10
#   with it            SSH-2.0-OpenSSH_9.2p1
# DebianBanner is Debian's own switch for it. The first value sshd reads
# wins, and this file sorts first in sshd_config.d.
DebianBanner no
