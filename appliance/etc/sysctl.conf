# Generated as part of the HexaRouting appliance. Kernel knobs that are not
# boot parameters and therefore do not belong on the GRUB command line.

# Automatic NUMA balancing migrates pages behind the process's back. VPP
# workers are pinned and their memory is already allocated on the right node,
# so the only thing left to do is stall the worker while a page moves.
kernel.numa_balancing = 0

# The dataplane must never be swapped out. There is normally no swap on the
# appliance, but an operator who adds one should not lose the session table.
vm.swappiness = 0
