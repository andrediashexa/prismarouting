# Generated as part of the Prisma Routing appliance. Kernel knobs that are not
# boot parameters and therefore do not belong on the GRUB command line.

# Automatic NUMA balancing migrates pages behind the process's back. VPP
# workers are pinned and their memory is already allocated on the right node,
# so the only thing left to do is stall the worker while a page moves.
kernel.numa_balancing = 0

# The dataplane must never be swapped out. There is normally no swap on the
# appliance, but an operator who adds one should not lose the session table.
vm.swappiness = 0

# A router never configures itself from a neighbour's Router Advertisement.
#
# This became load-bearing with #213. Until then no advertisement reached the
# kernel over a linux_cp pair at all - VPP dropped them - so what Linux would
# have done with one was moot. Now they are punted, because FRR learns an
# unnumbered peer's address from them and from nothing else, and the kernel on
# a box with IPv6 forwarding off would take the default route in them: measured
# in a lab container, "default via fe80::... proto ra", from a neighbour that
# merely advertised itself. linux_nl then syncs that route into the VPP FIB,
# measured: `show ip6 fib ::/0` came back with an active `lcp-rt-dynamic` path
# via the neighbour's link-local. A neighbour that advertises itself would be
# installing the box's IPv6 default route in the dataplane.
#
# FRR is unaffected: zebra reads advertisements on a socket of its own, not
# through the kernel's autoconfiguration, so BGP unnumbered still comes up with
# this set to 0 - asserted in lab/routing.sh.
#
# `default` is what a TAP created later inherits, and pairs are created long
# after boot; `all` is what the interfaces that already exist get.
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0
