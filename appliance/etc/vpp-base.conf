# Base for the VPP startup.conf, editable by the operator.
#
# hexarouting-tune concatenates this file with the cpu, buffers and memory
# stanzas it computes, and writes the result to /etc/vpp/startup.conf.
#
# Do NOT put cpu{}, buffers{}, memory{} or plugins{} here: they are generated.
# The plugins stanza is generated because the decision about DPDK depends on
# hugepages being present: without them the DPDK EAL fails at init and VPP
# exits - and since vpp.service has Restart=always, that becomes a restart
# loop.
#
# statseg{} DOES belong here, and this is the only place it can go. VPP keeps
# every counter in a segment of fixed size, each dataplane interface costs it
# about 2.9 kB, and a box that fills it does not refuse the interface: the
# dataplane aborts. Nothing is written here because nothing the tuner reads
# predicts how many interfaces a box will carry, and a CGNAT subscriber is not
# an interface. VPP's own default of 32 MB was measured aborting between 7,000
# and 8,000 interfaces, so a box that stacks a sub-interface per customer has
# to say so:
#
#   statseg {
#     size 256M
#   }
#
# The boot self-test prints how much of the segment this box is spending, and
# over how many interfaces.

unix {
  nodaemon
  log /var/log/vpp/vpp.log
  full-coredump
  cli-listen /run/vpp/cli.sock
  gid vpp
}

api-trace {
  on
}

api-segment {
  gid vpp
}

socksvr {
  default
}

linux-cp {
  lcp-sync
  lcp-auto-subint
}
