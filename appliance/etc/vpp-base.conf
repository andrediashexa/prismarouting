# Base do startup.conf do VPP, editavel pelo operador.
#
# O hexarouting-tune concatena este arquivo com as stanzas cpu, buffers e
# memory que ele calcula, e grava o resultado em /etc/vpp/startup.conf.
#
# NAO coloque cpu{}, buffers{} nem memory{} aqui: elas sao calculadas e
# seriam duplicadas. Tudo o mais e seu.

unix {
  nodaemon
  log /var/log/vpp/vpp.log
  full-coredump
  cli-listen /run/vpp/cli.sock
  gid vpp
}

api-trace {
  on
}

api-segment {
  gid vpp
}

socksvr {
  default
}

plugins {
  plugin default { enable }
  plugin bpa_plugin.so { enable }
  plugin linux_cp_plugin.so { enable }
  plugin linux_nl_plugin.so { enable }
}

linux-cp {
  lcp-sync
  lcp-auto-subint
}
