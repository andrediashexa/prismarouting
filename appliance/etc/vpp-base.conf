# Base for the VPP startup.conf, editable by the operator.
#
# prisma-routing-tune concatenates this file with the cpu, buffers and memory
# stanzas it computes, and writes the result to /etc/vpp/startup.conf.
#
# Do NOT put cpu{}, buffers{}, memory{} or plugins{} here: they are generated.
# The plugins stanza is generated because the decision about DPDK depends on
# hugepages being present: without them the DPDK EAL fails at init and VPP
# exits - and since vpp.service has Restart=always, that becomes a restart
# loop.
#
# statseg{} BELONGS HERE, and a stanza here is the last word on the size. VPP
# keeps every counter in a segment of fixed size, and a box that fills it does
# not refuse the interface: the dataplane aborts. VPP's own default of 32 MB
# was measured holding 7,000 interfaces and aborting before 8,000.
#
# Nothing is written here by default, and nothing needs to be: prisma-routing-tune
# counts the interfaces /etc/prisma-routing/prisma-routing.conf configures this box
# for and writes a statseg stanza of its own when they need more than 32 MB, at
# 4793 bytes each - 32 MB divided by the 7,000 that segment was measured
# holding. A box with a handful of ports gets nothing, because a stanza smaller
# than what VPP gives away would cost it counters and buy it nothing.
#
# Put one here to choose the size yourself, and the tuner steps aside for it:
#
#   statseg {
#     size 256M
#   }
#
# Interfaces created while the box runs - a PPPoE session per subscriber - are
# in no configuration file, so a box that makes them is a box that sets this.
# The boot self-test prints how much of the segment this box is spending, over
# how many interfaces, and which of the three chose the size.

unix {
  nodaemon
  log /var/log/vpp/vpp.log
  full-coredump
  cli-listen /run/vpp/cli.sock
  gid vpp
}

api-trace {
  on
}

api-segment {
  gid vpp
}

socksvr {
  default
}

linux-cp {
  lcp-sync
  lcp-auto-subint
}
