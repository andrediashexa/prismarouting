# Base do startup.conf do VPP, editavel pelo operador.
#
# O hexarouting-tune concatena este arquivo com as stanzas cpu, buffers e
# memory que ele calcula, e grava o resultado em /etc/vpp/startup.conf.
#
# NAO coloque cpu{}, buffers{}, memory{} nem plugins{} aqui: sao geradas.
# A stanza plugins e gerada porque a decisao sobre o DPDK depende de haver
# hugepage: sem ela a EAL do DPDK falha na inicializacao e o VPP sai - e
# como o vpp.service tem Restart=always, isso vira um loop de reinicio.

unix {
  nodaemon
  log /var/log/vpp/vpp.log
  full-coredump
  cli-listen /run/vpp/cli.sock
  gid vpp
}

api-trace {
  on
}

api-segment {
  gid vpp
}

socksvr {
  default
}

linux-cp {
  lcp-sync
  lcp-auto-subint
}
