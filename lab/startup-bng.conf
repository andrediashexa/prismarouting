# Lab config for the BNG spike (#170). Not a product configuration.
#
# The pppoe plugin is what makes this different from every other lab conf: it
# registers ethertypes 0x8863/0x8864 at plugin init, unconditionally. linux_cp
# is loaded here ON PURPOSE and NOT to be used - its presence is the evidence
# that a box can hold both, which is the half of #170's (a') objection that can
# be settled by looking.
unix {
  nodaemon
  cli-listen /run/vpp/cli.sock
  full-coredump
  gid vpp
}

memory {
  main-heap-size 512M
  main-heap-page-size 4k
}

buffers {
  buffers-per-numa 16384
  page-size 4k
}

plugins {
  path /vpp_plugins:/usr/lib/x86_64-linux-gnu/vpp_plugins
  plugin dpdk_plugin.so { disable }
  plugin bpa_plugin.so { enable }
  plugin pppoe_plugin.so { enable }
  plugin af_packet_plugin.so { enable }
  plugin linux_cp_plugin.so { enable }
}

# accel-pppd reaches pppoe_add_del_session through this segment, as the client
# named "accel-vpp" in "show api clients".
api-segment {
  gid vpp
}
