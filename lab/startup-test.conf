# Minimal config for testing the plugin with no NIC, no DPDK and no hugepages.
# Not for load - see appliance/ for the production config.
unix {
  nodaemon
  cli-listen /run/vpp/cli.sock
  full-coredump
}

memory {
  main-heap-size 512M
  main-heap-page-size 4k
}

buffers {
  buffers-per-numa 16384
  page-size 4k
}

plugins {
  path /vpp_plugins:/usr/lib/x86_64-linux-gnu/vpp_plugins
  plugin dpdk_plugin.so { disable }
  plugin bpa_plugin.so { enable }
}
