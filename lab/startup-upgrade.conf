# Like startup-test.conf, with ONE difference that is the whole point of it:
# the plugin path holds only the directory an INSTALL writes to.
#
# lab/startup-test.conf searches /vpp_plugins first, which is where the build
# links its output. A lab that booted with that path would load the plugin the
# BUILD made and never the one appliance/install.sh put on the box - so the
# upgrade under test could install nothing at all and every reading would
# still be green. That is the shape of #99, #119 and #184: a fixture that
# quietly supplies the thing the product is supposed to supply.
#
# So lab/upgrade.sh boots with this, and the plugin VPP loads is the file the
# installer wrote. The directory is the one appliance/install.sh defaults
# PLUGIN_DIR to, spelled the same way for the same reason.
unix {
  nodaemon
  cli-listen /run/vpp/cli.sock
  full-coredump
}

memory {
  main-heap-size 512M
  main-heap-page-size 4k
}

buffers {
  buffers-per-numa 16384
  page-size 4k
}

plugins {
  path /usr/lib/x86_64-linux-gnu/vpp_plugins
  plugin dpdk_plugin.so { disable }
  plugin bpa_plugin.so { enable }
}

# The binary API's shared-memory segment, group-owned so an account that is not
# root can use it, exactly as lab/startup-test.conf explains.
api-segment {
  gid vpp
}
