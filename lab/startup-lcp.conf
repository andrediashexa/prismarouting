# Lab config for the control plane: linux_cp mirrors a VPP interface as a TAP
# in Linux, linux_nl brings netlink routes into the VPP FIB.
unix {
  nodaemon
  cli-listen /run/vpp/cli.sock
  full-coredump
  # The same "gid vpp" appliance/etc/vpp-base.conf carries. VPP creates
  # /run/vpp/cli.sock as 0775, so the write bit a client needs to connect is
  # the GROUP's: without this line the socket is root:root and only root can
  # reach the dataplane. lab/vty.sh used to paper over that with
  # "chmod 0666 /run/vpp/cli.sock", which meant the roles lab measured
  # authorization on a box whose sockets nobody ships.
  gid vpp
}

memory {
  main-heap-size 512M
  main-heap-page-size 4k
}

buffers {
  buffers-per-numa 16384
  page-size 4k
}

linux-cp {
  lcp-sync
  lcp-auto-subint
}

plugins {
  path /vpp_plugins:/usr/lib/x86_64-linux-gnu/vpp_plugins
  plugin dpdk_plugin.so { disable }
  plugin linux_cp_plugin.so { enable }
  plugin linux_nl_plugin.so { enable }
  plugin af_packet_plugin.so { enable }
  plugin bpa_plugin.so { enable }
}

# The binary API's shared-memory segment, group-owned so an account that is not
# root can use it. Without this a non-root VTY account cannot reach the API at
# all, which makes roles (#35) unusable: every operator would have to be root.
api-segment {
  gid vpp
}
